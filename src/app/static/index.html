<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>企业私有知识库</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --sidebar: #111827;
      --sidebar-2: #1f2937;
      --sidebar-text: #e5e7eb;
      --sidebar-muted: #9ca3af;
      --card: #ffffff;
      --line: #e5e7eb;
      --text: #111827;
      --muted: #6b7280;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --user-bg: #eef2ff;
      --bot-bg: #ffffff;
      --ok: #059669;
      --warn: #d97706;
      --danger: #dc2626;
      --radius: 14px;
      --shadow: 0 1px 2px rgba(16,24,40,.06), 0 8px 24px rgba(16,24,40,.06);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    a { color: var(--primary); }

    .app {
      display: grid;
      grid-template-columns: 280px 1fr;
      height: 100vh;
      overflow: hidden;
    }
    @media (max-width: 860px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .sidebar.open { display: flex; position: fixed; inset: 0; z-index: 40; width: min(320px, 88vw); }
      .backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 30; }
      .backdrop.show { display: block; }
    }

    /* —— 侧栏 —— */
    .sidebar {
      background: linear-gradient(180deg, #0b1220 0%, #111827 100%);
      color: var(--sidebar-text);
      display: flex;
      flex-direction: column;
      padding: 16px 12px;
      gap: 12px;
    }
    .brand {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px 14px;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .brand-mark {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, #6366f1, #22d3ee);
      display: grid; place-items: center; font-weight: 800; color: #fff;
      box-shadow: 0 6px 16px rgba(99,102,241,.35);
    }
    .brand h1 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: .2px; }
    .brand p { margin: 2px 0 0; font-size: 11px; color: var(--sidebar-muted); }

    .btn {
      border: none; border-radius: 10px; padding: 10px 12px;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      transition: .15s ease;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-ghost {
      background: transparent; color: var(--sidebar-text);
      border: 1px solid rgba(255,255,255,.1);
    }
    .btn-ghost:hover { background: rgba(255,255,255,.06); }
    .btn-light {
      background: #fff; color: var(--text); border: 1px solid var(--line);
    }
    .btn-light:hover { background: #f9fafb; }
    .btn-icon {
      width: 36px; height: 36px; padding: 0; border-radius: 10px;
      background: #fff; border: 1px solid var(--line);
    }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .btn-block { width: 100%; }

    .session-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 6px; color: var(--sidebar-muted); font-size: 12px;
    }
    .sessions {
      flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 4px;
      padding: 2px;
    }
    .sessions::-webkit-scrollbar { width: 6px; }
    .sessions::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 8px; }
    .sess {
      text-align: left; border: none; border-radius: 10px;
      background: transparent; color: var(--sidebar-text);
      padding: 10px 12px; display: flex; flex-direction: column; gap: 2px;
    }
    .sess:hover { background: rgba(255,255,255,.06); }
    .sess.active { background: rgba(99,102,241,.25); }
    .sess .t { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sess .s { font-size: 11px; color: var(--sidebar-muted); }

    .side-foot {
      border-top: 1px solid rgba(255,255,255,.08);
      padding-top: 12px; display: flex; flex-direction: column; gap: 8px;
    }
    .status-pill {
      display: flex; gap: 8px; flex-wrap: wrap; font-size: 11px;
    }
    .dot {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,.06); border-radius: 999px;
      padding: 4px 8px; color: var(--sidebar-muted);
    }
    .dot i {
      width: 7px; height: 7px; border-radius: 50%; background: #6b7280; display: inline-block;
    }
    .dot.ok i { background: #34d399; }
    .dot.bad i { background: #f87171; }

    .side-foot details {
      background: rgba(255,255,255,.04); border-radius: 10px; padding: 8px 10px;
    }
    .side-foot summary {
      cursor: pointer; font-size: 12px; color: var(--sidebar-muted); user-select: none;
    }
    .side-foot .cfg { display: grid; gap: 8px; margin-top: 10px; }
    .side-foot label { font-size: 11px; color: var(--sidebar-muted); }
    .side-foot input, .side-foot select {
      width: 100%; border-radius: 8px; border: 1px solid rgba(255,255,255,.12);
      background: #0b1220; color: var(--sidebar-text); padding: 8px 10px;
    }
    .side-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

    /* —— 主区 —— */
    .main {
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-width: 0;
      height: 100vh;
      background:
        radial-gradient(1200px 400px at 80% -10%, rgba(99,102,241,.08), transparent 60%),
        var(--bg);
    }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 20px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.8);
      backdrop-filter: blur(8px);
    }
    .topbar .left { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .topbar h2 {
      margin: 0; font-size: 16px; font-weight: 650;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .topbar .hint { font-size: 12px; color: var(--muted); }
    .menu-btn { display: none; }
    @media (max-width: 860px) { .menu-btn { display: inline-flex; } }

    .chat {
      overflow: auto; padding: 24px 16px 12px;
    }
    .chat-inner { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

    .empty {
      margin: 8vh auto 0; max-width: 640px; text-align: center; color: var(--muted);
    }
    .empty h3 { color: var(--text); font-size: 22px; margin: 0 0 8px; font-weight: 700; }
    .empty p { margin: 0 0 20px; line-height: 1.6; font-size: 14px; }
    .suggests {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: left;
    }
    @media (max-width: 640px) { .suggests { grid-template-columns: 1fr; } }
    .suggest {
      background: var(--card); border: 1px solid var(--line); border-radius: 12px;
      padding: 14px; box-shadow: var(--shadow); cursor: pointer; transition: .15s;
    }
    .suggest:hover { border-color: #c7d2fe; transform: translateY(-1px); }
    .suggest b { display: block; font-size: 13px; color: var(--text); margin-bottom: 4px; }
    .suggest span { font-size: 12px; color: var(--muted); line-height: 1.45; }

    .msg { display: flex; gap: 12px; align-items: flex-start; }
    .msg.user { flex-direction: row-reverse; }
    .avatar {
      width: 36px; height: 36px; border-radius: 12px; flex: none;
      display: grid; place-items: center; font-size: 13px; font-weight: 700; color: #fff;
    }
    .msg.bot .avatar { background: linear-gradient(135deg, #4f46e5, #06b6d4); }
    .msg.user .avatar { background: #334155; }
    .bubble {
      max-width: min(100%, 640px); border-radius: 16px; padding: 12px 14px;
      box-shadow: var(--shadow); border: 1px solid var(--line); background: var(--bot-bg);
      line-height: 1.65; font-size: 14.5px; white-space: pre-wrap; word-break: break-word;
    }
    .msg.user .bubble {
      background: var(--user-bg); border-color: #c7d2fe; border-bottom-right-radius: 6px;
    }
    .msg.bot .bubble { border-bottom-left-radius: 6px; }
    .msg.error .bubble { border-color: #fecaca; background: #fef2f2; color: #991b1b; }
    .meta-row {
      display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px;
    }
    .tag {
      font-size: 11px; border-radius: 999px; padding: 2px 8px;
      background: #f3f4f6; color: #4b5563; border: 1px solid var(--line);
    }
    .tag.mode { background: #eef2ff; color: #3730a3; border-color: #c7d2fe; }
    .sources {
      margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line);
      font-size: 12px; color: var(--muted);
    }
    .sources .src-title { font-weight: 600; color: #374151; margin-bottom: 6px; }
    .src-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .src-chip {
      background: #f8fafc; border: 1px solid var(--line); border-radius: 8px;
      padding: 4px 8px; color: #334155;
    }
    .attach-note {
      margin-top: 8px; font-size: 12px; color: var(--muted);
    }
    .typing {
      display: inline-flex; gap: 4px; align-items: center; padding: 4px 0;
    }
    .typing span {
      width: 6px; height: 6px; border-radius: 50%; background: #94a3b8;
      animation: blink 1.2s infinite ease-in-out;
    }
    .typing span:nth-child(2) { animation-delay: .15s; }
    .typing span:nth-child(3) { animation-delay: .3s; }
    @keyframes blink {
      0%, 80%, 100% { opacity: .35; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-2px); }
    }

    /* —— 输入区 —— */
    .composer-wrap {
      padding: 0 16px 16px; background: linear-gradient(180deg, transparent, var(--bg) 30%);
    }
    .composer {
      max-width: 820px; margin: 0 auto; background: var(--card);
      border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow);
      padding: 10px 12px 10px; display: flex; flex-direction: column; gap: 8px;
    }
    .composer.dragover {
      border-color: #818cf8; box-shadow: 0 0 0 3px rgba(99,102,241,.15);
    }
    .composer textarea {
      width: 100%; border: none; outline: none; resize: none; min-height: 52px; max-height: 180px;
      padding: 8px 6px; background: transparent; color: var(--text); line-height: 1.5;
    }
    .composer-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
    }
    .composer-left, .composer-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .chip-files {
      display: flex; flex-wrap: wrap; gap: 6px; min-height: 0;
    }
    .file-chip {
      font-size: 12px; background: #f3f4f6; border-radius: 8px; padding: 4px 8px;
      display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line);
    }
    .file-chip button {
      border: none; background: transparent; color: var(--muted); padding: 0 2px; font-size: 14px;
    }
    .mode-select {
      border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px;
      background: #fff; color: var(--muted); font-size: 12px;
    }
    .send-btn {
      background: var(--primary); color: #fff; border: none; border-radius: 999px;
      padding: 8px 16px; font-weight: 600; min-width: 72px;
    }
    .send-btn:hover { background: var(--primary-hover); }
    .send-btn:disabled { opacity: .55; }
    .foot-note {
      max-width: 820px; margin: 8px auto 0; text-align: center;
      font-size: 11px; color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="backdrop" id="backdrop"></div>
  <div class="app">
    <!-- 侧栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">KB</div>
        <div>
          <h1>企业私有知识库</h1>
          <p>检索增强 · 表查询 · 智能体</p>
        </div>
      </div>

      <button class="btn btn-primary btn-block" id="btnNew" type="button">＋ 新对话</button>

      <div class="session-head">
        <span>历史会话</span>
        <button class="btn btn-ghost" type="button" id="btnClearSess" style="padding:4px 8px;font-size:11px">清空列表</button>
      </div>
      <div class="sessions" id="sessionList"></div>

      <div class="side-foot">
        <div class="status-pill" id="healthDots">
          <span class="dot" id="dotRag"><i></i>知识索引</span>
          <span class="dot" id="dotDb"><i></i>业务库</span>
        </div>

        <div class="side-actions">
          <button class="btn btn-ghost" type="button" id="btnRebuild" title="重建叙述文档索引">重建索引</button>
          <button class="btn btn-ghost" type="button" id="btnIngest" title="导入 data/raw 下表格">导入表数据</button>
        </div>

        <details>
          <summary>连接与高级</summary>
          <div class="cfg">
            <div>
              <label>API 地址</label>
              <input id="base" value="" placeholder="默认当前站点" />
            </div>
            <div>
              <label>API Key（可选）</label>
              <input id="key" type="password" placeholder="开发模式可留空" autocomplete="off" />
            </div>
            <div>
              <label>默认路由</label>
              <select id="force">
                <option value="">自动识别（推荐）</option>
                <option value="rag">仅知识库</option>
                <option value="hybrid">知识库 + 表</option>
                <option value="sql">仅 SQL</option>
                <option value="agent">智能体</option>
                <option value="chat">闲聊</option>
              </select>
            </div>
            <button class="btn btn-ghost btn-block" type="button" id="btnHealth">刷新状态</button>
          </div>
        </details>
      </div>
    </aside>

    <!-- 主聊天 -->
    <section class="main">
      <header class="topbar">
        <div class="left">
          <button class="btn-icon menu-btn" type="button" id="btnMenu" aria-label="菜单">☰</button>
          <div style="min-width:0">
            <h2 id="chatTitle">新对话</h2>
            <div class="hint" id="chatSub">基于企业文档与业务表作答 · 支持附件</div>
          </div>
        </div>
        <div class="hint" id="sessIdLabel"></div>
      </header>

      <div class="chat" id="chatScroll">
        <div class="chat-inner" id="messages"></div>
      </div>

      <div class="composer-wrap">
        <div class="composer" id="composer">
          <div class="chip-files" id="fileChips"></div>
          <textarea id="input" rows="2" placeholder="输入问题，或上传文档 / 表格 / 代码… Enter 发送，Shift+Enter 换行"></textarea>
          <div class="composer-bar">
            <div class="composer-left">
              <label class="btn btn-light" style="padding:6px 10px;font-size:13px;cursor:pointer">
                ＋ 附件
                <input id="file" type="file" multiple hidden />
              </label>
              <select class="mode-select" id="forceBar" title="覆盖自动分流">
                <option value="">自动</option>
                <option value="rag">知识库</option>
                <option value="hybrid">混合</option>
                <option value="sql">SQL</option>
                <option value="agent">智能体</option>
                <option value="chat">闲聊</option>
              </select>
            </div>
            <div class="composer-right">
              <button class="send-btn" type="button" id="btnSend">发送</button>
            </div>
          </div>
        </div>
        <div class="foot-note">回答由大模型生成，重要决策请核对引用来源与表数据。内容仅在您的环境内处理。</div>
      </div>
    </section>
  </div>

<script>
(() => {
  const LS_KEY = "pkb.ui.v1";
  const $ = (id) => document.getElementById(id);

  const state = {
    sessions: [],
    activeId: null,
    files: [],
    sending: false,
  };

  function uid() {
    return "s-" + Math.random().toString(36).slice(2, 10);
  }
  function nowLabel() {
    const d = new Date();
    return d.toLocaleString("zh-CN", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
  }
  function load() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (!raw) return;
      const data = JSON.parse(raw);
      if (data.sessions) state.sessions = data.sessions;
      if (data.activeId) state.activeId = data.activeId;
      if (data.base != null) $("base").value = data.base;
      if (data.key != null) $("key").value = data.key;
      if (data.force != null) {
        $("force").value = data.force;
        $("forceBar").value = data.force;
      }
    } catch (_) {}
  }
  function save() {
    localStorage.setItem(LS_KEY, JSON.stringify({
      sessions: state.sessions,
      activeId: state.activeId,
      base: $("base").value,
      key: $("key").value,
      force: $("force").value || $("forceBar").value,
    }));
  }

  function apiBase() {
    const v = ($("base").value || "").trim().replace(/\/$/, "");
    if (v) return v;
    return location.origin;
  }
  function headersJson() {
    const h = { "Content-Type": "application/json" };
    const k = $("key").value.trim();
    if (k) h["X-API-Key"] = k;
    return h;
  }
  function headersMulti() {
    const h = {};
    const k = $("key").value.trim();
    if (k) h["X-API-Key"] = k;
    return h;
  }

  function active() {
    return state.sessions.find((s) => s.id === state.activeId) || null;
  }
  function ensureSession() {
    if (active()) return active();
    return newSession(false);
  }
  function newSession(select = true) {
    const s = {
      id: uid(),
      title: "新对话",
      updatedAt: Date.now(),
      messages: [],
    };
    state.sessions.unshift(s);
    if (select) state.activeId = s.id;
    save();
    renderSessions();
    renderMessages();
    return s;
  }

  function renderSessions() {
    const box = $("sessionList");
    box.innerHTML = "";
    if (!state.sessions.length) {
      box.innerHTML = '<div style="padding:12px;color:#9ca3af;font-size:12px">暂无会话，点击上方开始</div>';
      return;
    }
    for (const s of state.sessions) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "sess" + (s.id === state.activeId ? " active" : "");
      b.innerHTML = `<span class="t"></span><span class="s"></span>`;
      b.querySelector(".t").textContent = s.title || "未命名";
      b.querySelector(".s").textContent = new Date(s.updatedAt || Date.now()).toLocaleString("zh-CN", {
        month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit",
      });
      b.onclick = () => {
        state.activeId = s.id;
        save();
        renderSessions();
        renderMessages();
        closeMobile();
      };
      box.appendChild(b);
    }
    const cur = active();
    $("chatTitle").textContent = cur ? (cur.title || "对话") : "新对话";
    $("sessIdLabel").textContent = cur ? "会话 " + cur.id : "";
  }

  function esc(s) {
    return String(s ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function renderMessages() {
    const box = $("messages");
    const s = active();
    box.innerHTML = "";
    if (!s || !s.messages.length) {
      box.innerHTML = `
        <div class="empty">
          <h3>有什么可以帮您？</h3>
          <p>询问制度与文档、查询业务表，或上传文件后继续提问。系统会自动选择知识库 / 表查询 / 智能体。</p>
          <div class="suggests">
            <div class="suggest" data-q="什么是RAG？请结合知识库说明。"><b>知识问答</b><span>什么是 RAG？请结合知识库说明。</span></div>
            <div class="suggest" data-q="研发部有哪些人？人数是多少？"><b>表数据查询</b><span>研发部有哪些人？人数是多少？</span></div>
            <div class="suggest" data-q="员工表有多少人？另外用一句话解释什么是RAG。"><b>混合问答</b><span>表统计 + 概念解释一次完成。</span></div>
            <div class="suggest" data-q="你好，介绍一下你能做什么。"><b>能力介绍</b><span>快速了解本知识库助手。</span></div>
          </div>
        </div>`;
      box.querySelectorAll(".suggest").forEach((el) => {
        el.onclick = () => {
          $("input").value = el.getAttribute("data-q") || "";
          $("input").focus();
        };
      });
      return;
    }

    for (const m of s.messages) {
      const row = document.createElement("div");
      row.className = "msg " + (m.role === "user" ? "user" : "bot") + (m.error ? " error" : "");
      const av = document.createElement("div");
      av.className = "avatar";
      av.textContent = m.role === "user" ? "我" : "AI";
      const bub = document.createElement("div");
      bub.className = "bubble";

      if (m.pending) {
        bub.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
      } else {
        bub.innerHTML = esc(m.content);
        if (m.meta && (m.meta.mode || m.meta.reason)) {
          const meta = document.createElement("div");
          meta.className = "meta-row";
          if (m.meta.mode) meta.innerHTML += `<span class="tag mode">${esc(m.meta.mode)}</span>`;
          if (m.meta.reason) meta.innerHTML += `<span class="tag">${esc(m.meta.reason)}</span>`;
          if (m.meta.timing != null) meta.innerHTML += `<span class="tag">${Number(m.meta.timing).toFixed(2)}s</span>`;
          bub.appendChild(meta);
        }
        const sources = (m.meta && m.meta.sources) || [];
        const cites = (m.meta && m.meta.cite_ids) || [];
        if (sources.length || cites.length) {
          const src = document.createElement("div");
          src.className = "sources";
          src.innerHTML = `<div class="src-title">引用来源</div><div class="src-list"></div>`;
          const list = src.querySelector(".src-list");
          for (const name of sources) {
            const chip = document.createElement("span");
            chip.className = "src-chip";
            chip.textContent = name;
            list.appendChild(chip);
          }
          if (cites.length) {
            const c = document.createElement("span");
            c.className = "src-chip";
            c.textContent = "引用 " + cites.map((x) => "[C" + x + "]").join(" ");
            list.appendChild(c);
          }
          bub.appendChild(src);
        }
        if (m.meta && m.meta.attachments && m.meta.attachments.length) {
          const an = document.createElement("div");
          an.className = "attach-note";
          an.textContent = "附件: " + m.meta.attachments.map((a) => a.filename || a.relpath).filter(Boolean).join("、");
          bub.appendChild(an);
        }
        if (m.meta && m.meta.sql) {
          const an = document.createElement("div");
          an.className = "attach-note";
          an.textContent = "SQL: " + m.meta.sql;
          bub.appendChild(an);
        }
      }

      row.appendChild(av);
      row.appendChild(bub);
      box.appendChild(row);
    }
    const sc = $("chatScroll");
    sc.scrollTop = sc.scrollHeight;
    const cur = active();
    $("chatTitle").textContent = cur ? (cur.title || "对话") : "新对话";
    $("sessIdLabel").textContent = cur ? "会话 " + cur.id : "";
  }

  function setFiles(list) {
    state.files = list;
    const box = $("fileChips");
    box.innerHTML = "";
    state.files.forEach((f, i) => {
      const el = document.createElement("span");
      el.className = "file-chip";
      el.innerHTML = `<span></span><button type="button" title="移除">×</button>`;
      el.querySelector("span").textContent = f.name;
      el.querySelector("button").onclick = () => {
        state.files = state.files.filter((_, j) => j !== i);
        setFiles(state.files);
      };
      box.appendChild(el);
    });
  }

  async function refreshHealth() {
    try {
      const r = await fetch(apiBase() + "/v1/health");
      const j = await r.json();
      const rag = $("dotRag");
      const db = $("dotDb");
      rag.className = "dot " + (j.rag_index_ready ? "ok" : "bad");
      db.className = "dot " + (j.query_db_exists ? "ok" : "bad");
    } catch (_) {
      $("dotRag").className = "dot bad";
      $("dotDb").className = "dot bad";
    }
  }

  async function adminPost(path, body) {
    const r = await fetch(apiBase() + path, {
      method: "POST",
      headers: headersJson(),
      body: body === undefined ? undefined : JSON.stringify(body ?? {}),
    });
    const t = await r.text();
    let j;
    try { j = JSON.parse(t); } catch { throw new Error(t || r.statusText); }
    if (!r.ok || j.ok === false) {
      const msg = (j.error && j.error.message) || t || "请求失败";
      throw new Error(msg);
    }
    return j;
  }

  async function send() {
    if (state.sending) return;
    const text = $("input").value.trim();
    if (!text && !state.files.length) return;

    const s = ensureSession();
    if (s.title === "新对话" && text) {
      s.title = text.slice(0, 28) + (text.length > 28 ? "…" : "");
    }

    const userMsg = {
      role: "user",
      content: text || "（仅上传附件）",
      meta: state.files.length ? { attachments: state.files.map((f) => ({ filename: f.name })) } : null,
    };
    s.messages.push(userMsg);
    const pending = { role: "assistant", content: "", pending: true };
    s.messages.push(pending);
    s.updatedAt = Date.now();
    $("input").value = "";
    const filesSnap = state.files.slice();
    setFiles([]);
    state.sending = true;
    $("btnSend").disabled = true;
    save();
    renderSessions();
    renderMessages();

    try {
      const fd = new FormData();
      fd.append("message", text);
      fd.append("session_id", s.id);
      fd.append("use_memory", "true");
      fd.append("unpack_paste", "true");
      const force = $("forceBar").value || $("force").value;
      if (force) fd.append("force_mode", force);
      for (const f of filesSnap) fd.append("files", f, f.name);

      const r = await fetch(apiBase() + "/v1/chat", {
        method: "POST",
        headers: headersMulti(),
        body: fd,
      });
      const raw = await r.text();
      let data;
      try { data = JSON.parse(raw); } catch { throw new Error(raw || "无效响应"); }

      // 去掉 pending
      s.messages = s.messages.filter((m) => !m.pending);

      if (!r.ok || data.ok === false) {
        const err = (data && data.error) || {};
        s.messages.push({
          role: "assistant",
          error: true,
          content: (err.code ? err.code + " · " : "") + (err.message || raw || "请求失败"),
          meta: err.stage ? { reason: err.stage } : null,
        });
      } else {
        const res = data.result || {};
        s.messages.push({
          role: "assistant",
          content: data.answer || "",
          meta: {
            mode: data.mode,
            reason: data.plan && data.plan.reason,
            timing: data.timing,
            sources: res.sources || [],
            cite_ids: res.cite_ids || [],
            sql: res.sql,
            attachments: data.attachments || [],
          },
        });
      }
    } catch (e) {
      s.messages = s.messages.filter((m) => !m.pending);
      s.messages.push({
        role: "assistant",
        error: true,
        content: String(e.message || e),
      });
    } finally {
      s.updatedAt = Date.now();
      state.sending = false;
      $("btnSend").disabled = false;
      save();
      renderSessions();
      renderMessages();
      $("input").focus();
    }
  }

  function closeMobile() {
    $("sidebar").classList.remove("open");
    $("backdrop").classList.remove("show");
  }
  function openMobile() {
    $("sidebar").classList.add("open");
    $("backdrop").classList.add("show");
  }

  // events
  $("btnNew").onclick = () => newSession(true);
  $("btnClearSess").onclick = () => {
    if (!confirm("清空本机会话列表？（不影响服务端记忆文件）")) return;
    state.sessions = [];
    state.activeId = null;
    save();
    renderSessions();
    renderMessages();
  };
  $("btnSend").onclick = send;
  $("btnMenu").onclick = openMobile;
  $("backdrop").onclick = closeMobile;
  $("btnHealth").onclick = refreshHealth;
  $("btnRebuild").onclick = async () => {
    $("btnRebuild").disabled = true;
    try {
      await adminPost("/v1/rag/rebuild");
      alert("知识索引重建完成");
      refreshHealth();
    } catch (e) { alert(String(e.message || e)); }
    finally { $("btnRebuild").disabled = false; }
  };
  $("btnIngest").onclick = async () => {
    $("btnIngest").disabled = true;
    try {
      await adminPost("/v1/sqlite/ingest", {});
      alert("表数据导入完成");
      refreshHealth();
    } catch (e) { alert(String(e.message || e)); }
    finally { $("btnIngest").disabled = false; }
  };

  $("input").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });
  $("file").addEventListener("change", () => {
    const add = Array.from($("file").files || []);
    setFiles(state.files.concat(add));
    $("file").value = "";
  });

  // sync force selects
  $("force").addEventListener("change", () => {
    $("forceBar").value = $("force").value;
    save();
  });
  $("forceBar").addEventListener("change", () => {
    $("force").value = $("forceBar").value;
    save();
  });
  ["base", "key"].forEach((id) => $(id).addEventListener("change", save));

  // drag drop on composer
  const comp = $("composer");
  ["dragenter", "dragover"].forEach((ev) => comp.addEventListener(ev, (e) => {
    e.preventDefault();
    comp.classList.add("dragover");
  }));
  ["dragleave", "drop"].forEach((ev) => comp.addEventListener(ev, (e) => {
    e.preventDefault();
    comp.classList.remove("dragover");
  }));
  comp.addEventListener("drop", (e) => {
    const fl = e.dataTransfer && e.dataTransfer.files;
    if (fl && fl.length) setFiles(state.files.concat(Array.from(fl)));
  });

  // init
  load();
  if (!state.sessions.length) newSession(true);
  else if (!active()) state.activeId = state.sessions[0].id;
  renderSessions();
  renderMessages();
  refreshHealth();
})();
</script>
</body>
</html>
