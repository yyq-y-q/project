<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>企业私有知识库</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234f46e5'/%3E%3Cpath d='M18 22h28v24H18z' fill='none' stroke='%23fff' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='M24 34l6 6 12-12' fill='none' stroke='%23fff' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #f5f6fa;
      --bg-soft: #eef0f7;
      --sidebar: #0d1524;
      --sidebar-2: #121c30;
      --sidebar-line: rgba(255,255,255,.08);
      --sidebar-text: #e8ecf4;
      --sidebar-muted: #8b94a7;
      --card: #ffffff;
      --line: #e5e8f0;
      --text: #1c2333;
      --muted: #68718a;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-soft: #eef2ff;
      --accent: #0ea5e9;
      --user-bg: #eef2ff;
      --user-line: #c7d2fe;
      --error-bg: #fef2f2;
      --error-line: #fecaca;
      --error-text: #991b1b;
      --ok: #10b981;
      --warn: #f59e0b;
      --bad: #ef4444;
      --radius: 14px;
      --shadow-sm: 0 1px 2px rgba(16,24,40,.05);
      --shadow: 0 1px 3px rgba(16,24,40,.06), 0 10px 30px -12px rgba(16,24,40,.14);
      --font: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    a { color: var(--primary); }

    /* ===== 布局 ===== */
    .app { display: grid; grid-template-columns: 276px 1fr; height: 100vh; overflow: hidden; }

    /* ===== 侧栏 ===== */
    .sidebar {
      background:
        radial-gradient(420px 260px at 12% -8%, rgba(99,102,241,.22), transparent 65%),
        radial-gradient(360px 260px at 108% 112%, rgba(14,165,233,.10), transparent 60%),
        linear-gradient(180deg, var(--sidebar) 0%, var(--sidebar-2) 100%);
      color: var(--sidebar-text);
      display: flex; flex-direction: column;
      padding: 18px 14px 14px; gap: 14px;
    }
    .brand { display: flex; align-items: center; gap: 12px; padding: 4px 6px 16px; border-bottom: 1px solid var(--sidebar-line); }
    .brand-mark {
      width: 40px; height: 40px; border-radius: 12px; flex: none;
      background: linear-gradient(135deg, #6366f1, #22d3ee);
      display: grid; place-items: center;
      box-shadow: 0 8px 20px -6px rgba(99,102,241,.45);
    }
    .brand-mark svg { width: 22px; height: 22px; }
    .brand h1 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: .2px; }
    .brand p { margin: 3px 0 0; font-size: 11px; color: var(--sidebar-muted); }

    .btn {
      border: none; border-radius: 10px; padding: 10px 12px;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      transition: background .15s ease, border-color .15s ease, transform .1s ease;
      font-size: 13.5px;
    }
    .btn:active { transform: scale(.98); }
    .btn-primary {
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: #fff; font-weight: 600;
      box-shadow: 0 8px 20px -8px rgba(79,70,229,.55);
    }
    .btn-primary:hover { filter: brightness(1.07); }
    .btn-ghost {
      background: transparent; color: var(--sidebar-text);
      border: 1px solid rgba(255,255,255,.12);
    }
    .btn-ghost:hover { background: rgba(255,255,255,.07); }
    .btn-light { background: #fff; color: var(--text); border: 1px solid var(--line); }
    .btn-light:hover { background: #f8f9fc; }
    .btn-icon {
      width: 38px; height: 38px; padding: 0; border-radius: 10px;
      background: #fff; border: 1px solid var(--line); color: var(--text);
    }
    .btn-icon:hover { background: #f6f7fb; }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .btn-block { width: 100%; }

    .session-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 6px; color: var(--sidebar-muted); font-size: 12px; letter-spacing: .5px;
    }
    .sessions { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 4px; padding: 2px; }
    .sessions::-webkit-scrollbar { width: 5px; }
    .sessions::-webkit-scrollbar-thumb { background: rgba(255,255,255,.14); border-radius: 8px; }
    .sess {
      text-align: left; border: none; border-radius: 10px;
      background: transparent; color: var(--sidebar-text);
      padding: 10px 12px; display: flex; flex-direction: column; gap: 2px;
      transition: background .15s ease;
    }
    .sess:hover { background: rgba(255,255,255,.06); }
    .sess.active { background: rgba(99,102,241,.22); box-shadow: inset 2px 0 0 #818cf8; }
    .sess .t { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sess .s { font-size: 11px; color: var(--sidebar-muted); }

    .side-foot { border-top: 1px solid var(--sidebar-line); padding-top: 14px; display: flex; flex-direction: column; gap: 10px; }
    .status-pill { display: flex; gap: 8px; flex-wrap: wrap; font-size: 11px; }
    .dot {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,.06); border-radius: 999px;
      padding: 5px 10px; color: var(--sidebar-muted);
    }
    .dot i { width: 7px; height: 7px; border-radius: 50%; background: #6b7280; display: inline-block; }
    .dot.ok i { background: var(--ok); box-shadow: 0 0 0 3px rgba(16,185,129,.15); }
    .dot.bad i { background: var(--bad); box-shadow: 0 0 0 3px rgba(239,68,68,.15); }

    .side-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .side-foot details { background: rgba(255,255,255,.04); border-radius: 10px; padding: 9px 11px; }
    .side-foot summary { cursor: pointer; font-size: 12px; color: var(--sidebar-muted); user-select: none; }
    .side-foot .cfg { display: grid; gap: 10px; margin-top: 12px; }
    .side-foot label { font-size: 11px; color: var(--sidebar-muted); }
    .side-foot input, .side-foot select {
      width: 100%; border-radius: 8px; border: 1px solid rgba(255,255,255,.14);
      background: #0a111f; color: var(--sidebar-text); padding: 8px 10px; font-size: 13px;
      outline: none;
    }
    .side-foot input:focus, .side-foot select:focus { border-color: #818cf8; }

    /* ===== 移动端适配（置于基础样式之后，避免被同优先级覆盖） ===== */
    @media (max-width: 880px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .sidebar.open { display: flex; position: fixed; inset: 0; z-index: 40; width: min(320px, 88vw); }
      .backdrop { display: none; position: fixed; inset: 0; background: rgba(8,12,22,.45); z-index: 30; }
      .backdrop.show { display: block; }
    }

    /* ===== 主区 ===== */
    .main {
      display: grid; grid-template-rows: auto 1fr auto;
      min-width: 0; height: 100vh;
      background:
        radial-gradient(900px 420px at 85% -12%, rgba(99,102,241,.10), transparent 62%),
        radial-gradient(720px 360px at -8% 118%, rgba(14,165,233,.07), transparent 60%),
        var(--bg);
    }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 24px; border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.82); backdrop-filter: blur(10px);
    }
    .topbar .left { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .topbar h2 { margin: 0; font-size: 16px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .topbar .hint { font-size: 12px; color: var(--muted); }
    .menu-btn { display: none; }
    @media (max-width: 880px) { .menu-btn { display: inline-flex; } }

    .chat { overflow: auto; padding: 28px 20px 16px; }
    .chat::-webkit-scrollbar { width: 8px; }
    .chat::-webkit-scrollbar-thumb { background: #d3d8e4; border-radius: 8px; }
    .chat-inner { max-width: 840px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

    .empty { margin: 9vh auto 0; max-width: 660px; text-align: center; color: var(--muted); }
    .empty h3 { color: var(--text); font-size: 24px; margin: 0 0 10px; font-weight: 700; letter-spacing: .3px; }
    .empty p { margin: 0 0 26px; line-height: 1.7; font-size: 14px; }
    .suggests { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; text-align: left; }
    @media (max-width: 640px) { .suggests { grid-template-columns: 1fr; } }
    .suggest {
      background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      padding: 16px 18px; box-shadow: var(--shadow-sm); cursor: pointer;
      transition: border-color .15s ease, transform .15s ease, box-shadow .15s ease;
    }
    .suggest:hover { border-color: #b6c1f9; transform: translateY(-2px); box-shadow: var(--shadow); }
    .suggest b { display: block; font-size: 14px; color: var(--text); margin-bottom: 5px; }
    .suggest span { font-size: 12.5px; color: var(--muted); line-height: 1.5; }

    .msg { display: flex; gap: 12px; align-items: flex-start; }
    .msg.user { flex-direction: row-reverse; }
    .avatar {
      width: 38px; height: 38px; border-radius: 13px; flex: none;
      display: grid; place-items: center; font-size: 13px; font-weight: 700; color: #fff;
      letter-spacing: .5px;
    }
    .msg.bot .avatar { background: linear-gradient(135deg, #4f46e5, #0ea5e9); box-shadow: 0 6px 16px -6px rgba(79,70,229,.5); }
    .msg.user .avatar { background: #475569; }
    .bubble {
      max-width: min(100%, 660px); border-radius: 16px; padding: 13px 16px;
      box-shadow: var(--shadow-sm); border: 1px solid var(--line); background: var(--card);
      line-height: 1.7; font-size: 14.5px; white-space: pre-wrap; word-break: break-word;
    }
    .msg.user .bubble {
      background: var(--user-bg); border-color: var(--user-line);
      border-bottom-right-radius: 6px; color: #1e2350;
    }
    .msg.bot .bubble { border-bottom-left-radius: 6px; }
    .msg.error .bubble { border-color: var(--error-line); background: var(--error-bg); color: var(--error-text); }
    .meta-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .tag {
      font-size: 11px; border-radius: 999px; padding: 3px 9px;
      background: #f1f3f8; color: #5b6478; border: 1px solid var(--line);
    }
    .tag.mode { background: var(--primary-soft); color: #4338ca; border-color: var(--user-line); font-weight: 600; }
    .sources { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); font-size: 12px; color: var(--muted); }
    .sources .src-title { font-weight: 600; color: #3f475e; margin-bottom: 7px; }
    .src-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .src-chip {
      background: #f6f8fc; border: 1px solid var(--line); border-radius: 8px;
      padding: 4px 9px; color: #3d4763; font-size: 11.5px;
    }
    .attach-note { margin-top: 9px; font-size: 12px; color: var(--muted); }
    .typing { display: inline-flex; gap: 5px; align-items: center; padding: 6px 0; }
    .typing span {
      width: 7px; height: 7px; border-radius: 50%; background: #a5aec6;
      animation: blink 1.2s infinite ease-in-out;
    }
    .typing span:nth-child(2) { animation-delay: .15s; }
    .typing span:nth-child(3) { animation-delay: .3s; }
    @keyframes blink {
      0%, 80%, 100% { opacity: .3; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-3px); }
    }

    /* ===== 输入区 ===== */
    .composer-wrap { padding: 8px 20px 20px; }
    .composer {
      max-width: 840px; margin: 0 auto; background: var(--card);
      border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow);
      padding: 12px 14px; display: flex; flex-direction: column; gap: 10px;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .composer:focus-within { border-color: #a5b4fc; box-shadow: 0 0 0 4px rgba(99,102,241,.10), var(--shadow); }
    .composer.dragover { border-color: #818cf8; box-shadow: 0 0 0 4px rgba(99,102,241,.18); }
    .composer textarea {
      width: 100%; border: none; outline: none; resize: none;
      min-height: 54px; max-height: 190px; padding: 8px 6px;
      background: transparent; color: var(--text); line-height: 1.55; font-size: 14.5px;
    }
    .composer-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .composer-left, .composer-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .chip-files { display: flex; flex-wrap: wrap; gap: 6px; min-height: 0; }
    .file-chip {
      font-size: 12px; background: #f1f3f8; border-radius: 8px; padding: 5px 9px;
      display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); color: #3d4763;
    }
    .file-chip button { border: none; background: transparent; color: var(--muted); padding: 0 3px; font-size: 14px; }
    .file-chip button:hover { color: var(--bad); }
    .mode-select {
      border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px;
      background: #fff; color: var(--muted); font-size: 12.5px; outline: none;
    }
    .mode-select:focus { border-color: #a5b4fc; }
    .send-btn {
      background: linear-gradient(135deg, #4f46e5, #6366f1); color: #fff;
      border: none; border-radius: 999px; padding: 9px 18px; font-weight: 600;
      min-width: 76px; box-shadow: 0 8px 18px -8px rgba(79,70,229,.55);
      transition: filter .15s ease, transform .1s ease;
    }
    .send-btn:hover { filter: brightness(1.07); }
    .send-btn:active { transform: scale(.98); }
    .send-btn:disabled { opacity: .55; cursor: not-allowed; }
    .foot-note { max-width: 840px; margin: 10px auto 0; text-align: center; font-size: 11.5px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="backdrop" id="backdrop"></div>
  <div class="app">
    <!-- 侧栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="M12 22V12"/><path d="M3 7l9 5 9-5"/></svg>
        </div>
        <div>
          <h1>企业私有知识库</h1>
          <p>检索增强 · 表查询 · 智能体</p>
        </div>
      </div>

      <button class="btn btn-primary btn-block" id="btnNew" type="button">＋ 新对话</button>

      <div class="session-head">
        <span>历史会话</span>
        <button class="btn btn-ghost" type="button" id="btnClearSess" style="padding:4px 8px;font-size:11px">清空列表</button>
      </div>
      <div class="sessions" id="sessionList"></div>

      <div class="side-foot">
        <div class="status-pill" id="healthDots">
          <span class="dot" id="dotRag"><i></i>知识索引</span>
          <span class="dot" id="dotDb"><i></i>业务库</span>
        </div>

        <div class="side-actions">
          <button class="btn btn-ghost" type="button" id="btnRebuild" title="重建叙述文档索引">重建索引</button>
          <button class="btn btn-ghost" type="button" id="btnIngest" title="导入 data/raw 下表格">导入表数据</button>
        </div>

        <details>
          <summary>连接与高级</summary>
          <div class="cfg">
            <div>
              <label>API 地址</label>
              <input id="base" value="" placeholder="默认当前站点" />
            </div>
            <div>
              <label>API Key（可选）</label>
              <input id="key" type="password" placeholder="开发模式可留空" autocomplete="off" />
            </div>
            <div>
              <label>默认路由</label>
              <select id="force">
                <option value="">自动识别（推荐）</option>
                <option value="rag">仅知识库</option>
                <option value="hybrid">知识库 + 表</option>
                <option value="sql">仅 SQL</option>
                <option value="agent">智能体</option>
                <option value="chat">闲聊</option>
              </select>
            </div>
            <button class="btn btn-ghost btn-block" type="button" id="btnHealth">刷新状态</button>
          </div>
        </details>
      </div>
    </aside>

    <!-- 主聊天 -->
    <section class="main">
      <header class="topbar">
        <div class="left">
          <button class="btn-icon menu-btn" type="button" id="btnMenu" aria-label="菜单">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <div style="min-width:0">
            <h2 id="chatTitle">新对话</h2>
            <div class="hint" id="chatSub">基于企业文档与业务表作答 · 支持附件</div>
          </div>
        </div>
        <div class="hint" id="sessIdLabel"></div>
      </header>

      <div class="chat" id="chatScroll">
        <div class="chat-inner" id="messages"></div>
      </div>

      <div class="composer-wrap">
        <div class="composer" id="composer">
          <div class="chip-files" id="fileChips"></div>
          <textarea id="input" rows="2" placeholder="输入问题，或上传文档 / 表格 / 代码… Enter 发送，Shift+Enter 换行"></textarea>
          <div class="composer-bar">
            <div class="composer-left">
              <label class="btn btn-light" style="padding:6px 12px;font-size:13px;cursor:pointer">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px"><path d="M21.44 11.05 12.25 20.24a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                ＋ 附件
                <input id="file" type="file" multiple hidden />
              </label>
              <select class="mode-select" id="forceBar" title="覆盖自动分流">
                <option value="">自动</option>
                <option value="rag">知识库</option>
                <option value="hybrid">混合</option>
                <option value="sql">SQL</option>
                <option value="agent">智能体</option>
                <option value="chat">闲聊</option>
              </select>
            </div>
            <div class="composer-right">
              <button class="send-btn" type="button" id="btnSend">
                发送
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>
              </button>
            </div>
          </div>
        </div>
        <div class="foot-note">回答由大模型生成，重要决策请核对引用来源与表数据。内容仅在您的环境内处理。</div>
      </div>
    </section>
  </div>

<script>
(() => {
  const LS_KEY = "pkb.ui.v1";
  const $ = (id) => document.getElementById(id);

  const state = {
    sessions: [],
    activeId: null,
    files: [],
    sending: false,
  };

  function uid() {
    return "s-" + Math.random().toString(36).slice(2, 10);
  }
  function nowLabel() {
    const d = new Date();
    return d.toLocaleString("zh-CN", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
  }
  function load() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (!raw) return;
      const data = JSON.parse(raw);
      if (data.sessions) state.sessions = data.sessions;
      if (data.activeId) state.activeId = data.activeId;
      if (data.base != null) $("base").value = data.base;
      if (data.key != null) $("key").value = data.key;
      if (data.force != null) {
        $("force").value = data.force;
        $("forceBar").value = data.force;
      }
    } catch (_) {}
  }
  function save() {
    localStorage.setItem(LS_KEY, JSON.stringify({
      sessions: state.sessions,
      activeId: state.activeId,
      base: $("base").value,
      key: $("key").value,
      force: $("force").value || $("forceBar").value,
    }));
  }

  function apiBase() {
    const v = ($("base").value || "").trim().replace(/\/$/, "");
    if (v) return v;
    return location.origin;
  }
  function headersJson() {
    const h = { "Content-Type": "application/json" };
    const k = $("key").value.trim();
    if (k) h["X-API-Key"] = k;
    return h;
  }
  function headersMulti() {
    const h = {};
    const k = $("key").value.trim();
    if (k) h["X-API-Key"] = k;
    return h;
  }

  function active() {
    return state.sessions.find((s) => s.id === state.activeId) || null;
  }
  function ensureSession() {
    if (active()) return active();
    return newSession(false);
  }
  function newSession(select = true) {
    const s = {
      id: uid(),
      title: "新对话",
      updatedAt: Date.now(),
      messages: [],
    };
    state.sessions.unshift(s);
    if (select) state.activeId = s.id;
    save();
    renderSessions();
    renderMessages();
    return s;
  }

  function renderSessions() {
    const box = $("sessionList");
    box.innerHTML = "";
    if (!state.sessions.length) {
      box.innerHTML = '<div style="padding:12px;color:#9ca3af;font-size:12px">暂无会话，点击上方开始</div>';
      return;
    }
    for (const s of state.sessions) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "sess" + (s.id === state.activeId ? " active" : "");
      b.innerHTML = `<span class="t"></span><span class="s"></span>`;
      b.querySelector(".t").textContent = s.title || "未命名";
      b.querySelector(".s").textContent = new Date(s.updatedAt || Date.now()).toLocaleString("zh-CN", {
        month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit",
      });
      b.onclick = () => {
        state.activeId = s.id;
        save();
        renderSessions();
        renderMessages();
        closeMobile();
      };
      box.appendChild(b);
    }
    const cur = active();
    $("chatTitle").textContent = cur ? (cur.title || "对话") : "新对话";
    $("sessIdLabel").textContent = cur ? "会话 " + cur.id : "";
  }

  function esc(s) {
    return String(s ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function renderMessages() {
    const box = $("messages");
    const s = active();
    box.innerHTML = "";
    if (!s || !s.messages.length) {
      box.innerHTML = `
        <div class="empty">
          <h3>你好，我是 Iris，有什么可以帮您？</h3>
          <p>询问制度与文档、查询业务表，或上传文件后继续提问。系统会自动选择知识库 / 表查询 / 智能体。</p>
          <div class="suggests">
            <div class="suggest" data-q="什么是RAG？请结合知识库说明。"><b>知识问答</b><span>什么是 RAG？请结合知识库说明。</span></div>
            <div class="suggest" data-q="研发部有哪些人？人数是多少？"><b>表数据查询</b><span>研发部有哪些人？人数是多少？</span></div>
            <div class="suggest" data-q="员工表有多少人？另外用一句话解释什么是RAG。"><b>混合问答</b><span>表统计 + 概念解释一次完成。</span></div>
            <div class="suggest" data-q="你好，介绍一下你能做什么。"><b>能力介绍</b><span>快速了解本知识库助手。</span></div>
          </div>
        </div>`;
      box.querySelectorAll(".suggest").forEach((el) => {
        el.onclick = () => {
          $("input").value = el.getAttribute("data-q") || "";
          $("input").focus();
        };
      });
      return;
    }

    for (const m of s.messages) {
      const row = document.createElement("div");
      row.className = "msg " + (m.role === "user" ? "user" : "bot") + (m.error ? " error" : "");
      const av = document.createElement("div");
      av.className = "avatar";
      av.textContent = m.role === "user" ? "我" : "Iris";
      const bub = document.createElement("div");
      bub.className = "bubble";

      if (m.pending) {
        bub.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
      } else {
        bub.innerHTML = esc(m.content);
        if (m.meta && (m.meta.mode || m.meta.reason)) {
          const meta = document.createElement("div");
          meta.className = "meta-row";
          if (m.meta.mode) meta.innerHTML += `<span class="tag mode">${esc(m.meta.mode)}</span>`;
          if (m.meta.reason) meta.innerHTML += `<span class="tag">${esc(m.meta.reason)}</span>`;
          if (m.meta.timing != null) meta.innerHTML += `<span class="tag">${Number(m.meta.timing).toFixed(2)}s</span>`;
          bub.appendChild(meta);
        }
        const sources = (m.meta && m.meta.sources) || [];
        const cites = (m.meta && m.meta.cite_ids) || [];
        if (sources.length || cites.length) {
          const src = document.createElement("div");
          src.className = "sources";
          src.innerHTML = `<div class="src-title">引用来源</div><div class="src-list"></div>`;
          const list = src.querySelector(".src-list");
          for (const name of sources) {
            const chip = document.createElement("span");
            chip.className = "src-chip";
            chip.textContent = name;
            list.appendChild(chip);
          }
          if (cites.length) {
            const c = document.createElement("span");
            c.className = "src-chip";
            c.textContent = "引用 " + cites.map((x) => "[C" + x + "]").join(" ");
            list.appendChild(c);
          }
          bub.appendChild(src);
        }
        if (m.meta && m.meta.attachments && m.meta.attachments.length) {
          const an = document.createElement("div");
          an.className = "attach-note";
          an.textContent = "附件: " + m.meta.attachments.map((a) => a.filename || a.relpath).filter(Boolean).join("、");
          bub.appendChild(an);
        }
        if (m.meta && m.meta.sql) {
          const an = document.createElement("div");
          an.className = "attach-note";
          an.textContent = "SQL: " + m.meta.sql;
          bub.appendChild(an);
        }
      }

      row.appendChild(av);
      row.appendChild(bub);
      box.appendChild(row);
    }
    const sc = $("chatScroll");
    sc.scrollTop = sc.scrollHeight;
    const cur = active();
    $("chatTitle").textContent = cur ? (cur.title || "对话") : "新对话";
    $("sessIdLabel").textContent = cur ? "会话 " + cur.id : "";
  }

  function setFiles(list) {
    state.files = list;
    const box = $("fileChips");
    box.innerHTML = "";
    state.files.forEach((f, i) => {
      const el = document.createElement("span");
      el.className = "file-chip";
      el.innerHTML = `<span></span><button type="button" title="移除">×</button>`;
      el.querySelector("span").textContent = f.name;
      el.querySelector("button").onclick = () => {
        state.files = state.files.filter((_, j) => j !== i);
        setFiles(state.files);
      };
      box.appendChild(el);
    });
  }

  async function refreshHealth() {
    try {
      const r = await fetch(apiBase() + "/v1/health");
      const j = await r.json();
      const rag = $("dotRag");
      const db = $("dotDb");
      rag.className = "dot " + (j.rag_index_ready ? "ok" : "bad");
      db.className = "dot " + (j.query_db_exists ? "ok" : "bad");
    } catch (_) {
      $("dotRag").className = "dot bad";
      $("dotDb").className = "dot bad";
    }
  }

  async function adminPost(path, body) {
    const r = await fetch(apiBase() + path, {
      method: "POST",
      headers: headersJson(),
      body: body === undefined ? undefined : JSON.stringify(body ?? {}),
    });
    const t = await r.text();
    let j;
    try { j = JSON.parse(t); } catch { throw new Error(t || r.statusText); }
    if (!r.ok || j.ok === false) {
      const msg = (j.error && j.error.message) || t || "请求失败";
      throw new Error(msg);
    }
    return j;
  }

  async function send() {
    if (state.sending) return;
    const text = $("input").value.trim();
    if (!text && !state.files.length) return;

    const s = ensureSession();
    if (s.title === "新对话" && text) {
      s.title = text.slice(0, 28) + (text.length > 28 ? "…" : "");
    }

    const userMsg = {
      role: "user",
      content: text || "（仅上传附件）",
      meta: state.files.length ? { attachments: state.files.map((f) => ({ filename: f.name })) } : null,
    };
    s.messages.push(userMsg);
    const pending = { role: "assistant", content: "", pending: true };
    s.messages.push(pending);
    s.updatedAt = Date.now();
    $("input").value = "";
    const filesSnap = state.files.slice();
    setFiles([]);
    state.sending = true;
    $("btnSend").disabled = true;
    save();
    renderSessions();
    renderMessages();

    try {
      const fd = new FormData();
      fd.append("message", text);
      fd.append("session_id", s.id);
      fd.append("use_memory", "true");
      fd.append("unpack_paste", "true");
      const force = $("forceBar").value || $("force").value;
      if (force) fd.append("force_mode", force);
      for (const f of filesSnap) fd.append("files", f, f.name);

      const r = await fetch(apiBase() + "/v1/chat", {
        method: "POST",
        headers: headersMulti(),
        body: fd,
      });
      const raw = await r.text();
      let data;
      try { data = JSON.parse(raw); } catch { throw new Error(raw || "无效响应"); }

      // 去掉 pending
      s.messages = s.messages.filter((m) => !m.pending);

      if (!r.ok || data.ok === false) {
        const err = (data && data.error) || {};
        s.messages.push({
          role: "assistant",
          error: true,
          content: (err.code ? err.code + " · " : "") + (err.message || raw || "请求失败"),
          meta: err.stage ? { reason: err.stage } : null,
        });
      } else {
        const res = data.result || {};
        s.messages.push({
          role: "assistant",
          content: data.answer || "",
          meta: {
            mode: data.mode,
            reason: data.plan && data.plan.reason,
            timing: data.timing,
            sources: res.sources || [],
            cite_ids: res.cite_ids || [],
            sql: res.sql,
            attachments: data.attachments || [],
          },
        });
      }
    } catch (e) {
      s.messages = s.messages.filter((m) => !m.pending);
      s.messages.push({
        role: "assistant",
        error: true,
        content: String(e.message || e),
      });
    } finally {
      s.updatedAt = Date.now();
      state.sending = false;
      $("btnSend").disabled = false;
      save();
      renderSessions();
      renderMessages();
      $("input").focus();
    }
  }

  function closeMobile() {
    $("sidebar").classList.remove("open");
    $("backdrop").classList.remove("show");
  }
  function openMobile() {
    $("sidebar").classList.add("open");
    $("backdrop").classList.add("show");
  }

  // events
  $("btnNew").onclick = () => newSession(true);
  $("btnClearSess").onclick = () => {
    if (!confirm("清空本机会话列表？（不影响服务端记忆文件）")) return;
    state.sessions = [];
    state.activeId = null;
    save();
    renderSessions();
    renderMessages();
  };
  $("btnSend").onclick = send;
  $("btnMenu").onclick = openMobile;
  $("backdrop").onclick = closeMobile;
  $("btnHealth").onclick = refreshHealth;
  $("btnRebuild").onclick = async () => {
    $("btnRebuild").disabled = true;
    try {
      await adminPost("/v1/rag/rebuild");
      alert("知识索引重建完成");
      refreshHealth();
    } catch (e) { alert(String(e.message || e)); }
    finally { $("btnRebuild").disabled = false; }
  };
  $("btnIngest").onclick = async () => {
    $("btnIngest").disabled = true;
    try {
      await adminPost("/v1/sqlite/ingest", {});
      alert("表数据导入完成");
      refreshHealth();
    } catch (e) { alert(String(e.message || e)); }
    finally { $("btnIngest").disabled = false; }
  };

  $("input").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });
  $("file").addEventListener("change", () => {
    const add = Array.from($("file").files || []);
    setFiles(state.files.concat(add));
    $("file").value = "";
  });

  // sync force selects
  $("force").addEventListener("change", () => {
    $("forceBar").value = $("force").value;
    save();
  });
  $("forceBar").addEventListener("change", () => {
    $("force").value = $("forceBar").value;
    save();
  });
  ["base", "key"].forEach((id) => $(id).addEventListener("change", save));

  // drag drop on composer
  const comp = $("composer");
  ["dragenter", "dragover"].forEach((ev) => comp.addEventListener(ev, (e) => {
    e.preventDefault();
    comp.classList.add("dragover");
  }));
  ["dragleave", "drop"].forEach((ev) => comp.addEventListener(ev, (e) => {
    e.preventDefault();
    comp.classList.remove("dragover");
  }));
  comp.addEventListener("drop", (e) => {
    const fl = e.dataTransfer && e.dataTransfer.files;
    if (fl && fl.length) setFiles(state.files.concat(Array.from(fl)));
  });

  // init
  load();
  if (!state.sessions.length) newSession(true);
  else if (!active()) state.activeId = state.sessions[0].id;
  renderSessions();
  renderMessages();
  refreshHealth();
})();
</script>
</body>
</html>
