<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>企业私有知识库</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234f46e5'/%3E%3Cpath d='M18 22h28v24H18z' fill='none' stroke='%23fff' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='M24 34l6 6 12-12' fill='none' stroke='%23fff' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #f5f6fa;
      --bg-soft: #eef0f7;
      --sidebar: #0d1524;
      --sidebar-2: #121c30;
      --sidebar-line: rgba(255,255,255,.08);
      --sidebar-text: #e8ecf4;
      --sidebar-muted: #8b94a7;
      --card: #ffffff;
      --line: #e5e8f0;
      --text: #1c2333;
      --muted: #68718a;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-soft: #eef2ff;
      --accent: #0ea5e9;
      --user-bg: #eef2ff;
      --user-line: #c7d2fe;
      --error-bg: #fef2f2;
      --error-line: #fecaca;
      --error-text: #991b1b;
      --ok: #10b981;
      --warn: #f59e0b;
      --bad: #ef4444;
      --radius: 14px;
      --shadow-sm: 0 1px 2px rgba(16,24,40,.05);
      --shadow: 0 1px 3px rgba(16,24,40,.06), 0 10px 30px -12px rgba(16,24,40,.14);
      --font: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    a { color: var(--primary); }

    /* ===== 布局 ===== */
    .app { display: grid; grid-template-columns: 276px 1fr; height: 100vh; overflow: hidden; }

    /* ===== 侧栏 ===== */
    .sidebar {
      background:
        radial-gradient(420px 260px at 12% -8%, rgba(99,102,241,.22), transparent 65%),
        radial-gradient(360px 260px at 108% 112%, rgba(14,165,233,.10), transparent 60%),
        linear-gradient(180deg, var(--sidebar) 0%, var(--sidebar-2) 100%);
      color: var(--sidebar-text);
      display: flex; flex-direction: column;
      padding: 18px 14px 14px; gap: 14px;
    }
    .brand { display: flex; align-items: center; gap: 12px; padding: 4px 6px 16px; border-bottom: 1px solid var(--sidebar-line); }
    .brand-mark {
      width: 40px; height: 40px; border-radius: 12px; flex: none;
      background: linear-gradient(135deg, #6366f1, #22d3ee);
      display: grid; place-items: center;
      box-shadow: 0 8px 20px -6px rgba(99,102,241,.45);
    }
    .brand-mark svg { width: 22px; height: 22px; }
    .brand h1 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: .2px; }
    .brand p { margin: 3px 0 0; font-size: 11px; color: var(--sidebar-muted); }

    .btn {
      border: none; border-radius: 10px; padding: 10px 12px;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      transition: background .15s ease, border-color .15s ease, transform .1s ease;
      font-size: 13.5px;
    }
    .btn:active { transform: scale(.98); }
    .btn-primary {
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: #fff; font-weight: 600;
      box-shadow: 0 8px 20px -8px rgba(79,70,229,.55);
    }
    .btn-primary:hover { filter: brightness(1.07); }
    .btn-ghost {
      background: transparent; color: var(--sidebar-text);
      border: 1px solid rgba(255,255,255,.12);
    }
    .btn-ghost:hover { background: rgba(255,255,255,.07); }
    .btn-light { background: #fff; color: var(--text); border: 1px solid var(--line); }
    .btn-light:hover { background: #f8f9fc; }
    .btn-icon {
      width: 38px; height: 38px; padding: 0; border-radius: 10px;
      background: #fff; border: 1px solid var(--line); color: var(--text);
    }
    .btn-icon:hover { background: #f6f7fb; }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .btn-block { width: 100%; }

    .session-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 6px; color: var(--sidebar-muted); font-size: 12px; letter-spacing: .5px;
    }
    .sessions { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 4px; padding: 2px; }
    .sessions::-webkit-scrollbar { width: 5px; }
    .sessions::-webkit-scrollbar-thumb { background: rgba(255,255,255,.14); border-radius: 8px; }
    .sess-search {
      display: flex; align-items: center; gap: 6px;
      margin: 2px 0 6px; padding: 6px 10px;
      background: rgba(255,255,255,.06); border-radius: 10px;
      color: var(--sidebar-muted);
    }
    .sess-search input {
      flex: 1; min-width: 0; border: none; outline: none;
      background: transparent; color: var(--sidebar-text); font-size: 12px;
    }
    .sess-search input::placeholder { color: var(--sidebar-muted); }
    .sess-search input:focus { outline: none; }
    .sess {
      border-radius: 10px;
      background: transparent; color: var(--sidebar-text);
      padding: 6px 6px 6px 4px; display: flex; align-items: center; gap: 4px;
      transition: background .15s ease;
    }
    .sess:hover { background: rgba(255,255,255,.06); }
    .sess.active { background: rgba(99,102,241,.22); box-shadow: inset 2px 0 0 #818cf8; }
    .sess-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; cursor: pointer; padding: 4px 4px; }
    .sess .t { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sess .s { font-size: 11px; color: var(--sidebar-muted); }
    .rename-input {
      width: 100%; border: none; outline: none;
      background: rgba(255,255,255,.10); color: var(--sidebar-text);
      border-radius: 6px; padding: 2px 6px; font-size: 13px;
    }
    .rename-input:focus { outline: none; box-shadow: 0 0 0 1px rgba(129,140,248,.6); }
    .sess-ops { display: flex; gap: 2px; opacity: 0; transition: opacity .15s ease; }
    .sess:hover .sess-ops, .sess.active .sess-ops, .sess:focus-within .sess-ops { opacity: 1; }
    @media (hover: none) { .sess-ops { opacity: .6; } }
    .sess-op {
      width: 26px; height: 26px; padding: 0; flex: none;
      display: inline-flex; align-items: center; justify-content: center;
      border: none; border-radius: 8px;
      background: transparent; color: var(--sidebar-muted);
      transition: background .15s ease, color .15s ease;
    }
    .sess-op:hover { background: rgba(255,255,255,.12); color: #fff; }
    .sess-op.del:hover { background: rgba(244,63,94,.25); color: #fda4af; }

    .side-foot { border-top: 1px solid var(--sidebar-line); padding-top: 14px; display: flex; flex-direction: column; gap: 10px; }
    .status-pill { display: flex; gap: 8px; flex-wrap: wrap; font-size: 11px; }
    .dot {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,.06); border-radius: 999px;
      padding: 5px 10px; color: var(--sidebar-muted);
    }
    .dot i { width: 7px; height: 7px; border-radius: 50%; background: #6b7280; display: inline-block; }
    .dot.ok i { background: var(--ok); box-shadow: 0 0 0 3px rgba(16,185,129,.15); }
    .dot.bad i { background: var(--bad); box-shadow: 0 0 0 3px rgba(239,68,68,.15); }

    .side-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .side-foot details { background: rgba(255,255,255,.04); border-radius: 10px; padding: 9px 11px; }
    .side-foot summary { cursor: pointer; font-size: 12px; color: var(--sidebar-muted); user-select: none; }
    .side-foot .cfg { display: grid; gap: 10px; margin-top: 12px; }
    .side-foot label { font-size: 11px; color: var(--sidebar-muted); }
    .side-foot input, .side-foot select {
      width: 100%; border-radius: 8px; border: 1px solid rgba(255,255,255,.14);
      background: #0a111f; color: var(--sidebar-text); padding: 8px 10px; font-size: 13px;
      outline: none;
    }
    .side-foot input:focus, .side-foot select:focus { border-color: #818cf8; }

    /* ===== 移动端适配（置于基础样式之后，避免被同优先级覆盖） ===== */
    @media (max-width: 880px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .sidebar.open { display: flex; position: fixed; inset: 0; z-index: 40; width: min(320px, 88vw); }
      .backdrop { display: none; position: fixed; inset: 0; background: rgba(8,12,22,.45); z-index: 30; }
      .backdrop.show { display: block; }
    }

    /* ===== 工作区文件弹窗 ===== */
    .modal-mask[hidden] { display: none; }
    .modal-mask {
      position: fixed; inset: 0; z-index: 60;
      background: rgba(8,12,22,.45);
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .modal {
      width: min(560px, 100%);
      max-height: 78vh;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .modal-head {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
    }
    .modal-head b { font-size: 14px; }
    .modal-head .hint { flex: 1; font-size: 12px; color: var(--muted); text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .modal-body {
      overflow: auto; padding: 8px 10px;
      min-height: 120px;
    }
    .ws-row {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 8px; border-radius: 10px;
    }
    .ws-row:hover { background: var(--bg-soft); }
    .ws-row + .ws-row { border-top: 1px solid var(--line); }
    .ws-info { flex: 1; min-width: 0; }
    .ws-name { font-size: 13px; color: var(--text); word-break: break-all; }
    .ws-info .hint { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .modal-foot {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 16px;
      border-top: 1px solid var(--line);
    }
    .modal-foot .hint { flex: 1; font-size: 11px; color: var(--muted); }

    /* ===== 主区 ===== */
    .main {
      display: grid; grid-template-rows: auto 1fr auto;
      min-width: 0; height: 100vh;
      background:
        radial-gradient(900px 420px at 85% -12%, rgba(99,102,241,.10), transparent 62%),
        radial-gradient(720px 360px at -8% 118%, rgba(14,165,233,.07), transparent 60%),
        var(--bg);
    }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 24px; border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.82); backdrop-filter: blur(10px);
    }
    .topbar .left { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .topbar h2 { margin: 0; font-size: 16px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .topbar .hint { font-size: 12px; color: var(--muted); }
    .menu-btn { display: none; }
    @media (max-width: 880px) { .menu-btn { display: inline-flex; } }

    .chat { overflow: auto; padding: 28px 20px 16px; }
    .chat::-webkit-scrollbar { width: 8px; }
    .chat::-webkit-scrollbar-thumb { background: #d3d8e4; border-radius: 8px; }
    .chat-inner { max-width: 840px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

    .empty { margin: 9vh auto 0; max-width: 660px; text-align: center; color: var(--muted); }
    .empty h3 { color: var(--text); font-size: 24px; margin: 0 0 10px; font-weight: 700; letter-spacing: .3px; }
    .empty p { margin: 0 0 26px; line-height: 1.7; font-size: 14px; }
    .suggests { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; text-align: left; }
    @media (max-width: 640px) { .suggests { grid-template-columns: 1fr; } }
    .suggest {
      background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      padding: 16px 18px; box-shadow: var(--shadow-sm); cursor: pointer;
      transition: border-color .15s ease, transform .15s ease, box-shadow .15s ease;
    }
    .suggest:hover { border-color: #b6c1f9; transform: translateY(-2px); box-shadow: var(--shadow); }
    .suggest b { display: block; font-size: 14px; color: var(--text); margin-bottom: 5px; }
    .suggest span { font-size: 12.5px; color: var(--muted); line-height: 1.5; }

    .msg { display: flex; gap: 12px; align-items: flex-start; }
    .msg.user { flex-direction: row-reverse; }
    .avatar {
      width: 38px; height: 38px; border-radius: 13px; flex: none;
      display: grid; place-items: center; font-size: 13px; font-weight: 700; color: #fff;
      letter-spacing: .5px;
    }
    .msg.bot .avatar { background: linear-gradient(135deg, #4f46e5, #0ea5e9); box-shadow: 0 6px 16px -6px rgba(79,70,229,.5); }
    .msg.user .avatar { background: #475569; }
    .bubble {
      max-width: min(100%, 660px); border-radius: 16px; padding: 13px 16px;
      box-shadow: var(--shadow-sm); border: 1px solid var(--line); background: var(--card);
      line-height: 1.7; font-size: 14.5px; white-space: pre-wrap; word-break: break-word;
    }
    .msg.user .bubble {
      background: var(--user-bg); border-color: var(--user-line);
      border-bottom-right-radius: 6px; color: #1e2350;
    }
    .msg.bot .bubble { border-bottom-left-radius: 6px; }
    .msg.error .bubble { border-color: var(--error-line); background: var(--error-bg); color: var(--error-text); }
    .sources { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); font-size: 12px; color: var(--muted); }
    .sources .src-title { font-weight: 600; color: #3f475e; margin-bottom: 7px; }
    .src-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .src-chip {
      background: #f6f8fc; border: 1px solid var(--line); border-radius: 8px;
      padding: 4px 9px; color: #3d4763; font-size: 11.5px;
    }
    .attach-note { margin-top: 9px; font-size: 12px; color: var(--muted); }
    .file-dl-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .file-dl-chip {
      background: var(--primary-soft); color: #4338ca;
      border: 1px solid var(--user-line); border-radius: 8px;
      padding: 5px 10px; font-size: 12px; cursor: pointer;
      display: inline-flex; align-items: center; gap: 5px;
    }
    .file-dl-chip:hover { background: #e0e7ff; }

    /* ===== 消息底部：时间 + hover 操作 ===== */
    .msg-foot {
      display: flex; align-items: center; gap: 4px;
      margin-top: 6px; min-height: 24px;
      font-size: 11px; color: var(--muted);
    }
    .msg.user .msg-foot { flex-direction: row-reverse; }
    .msg-foot .time { white-space: nowrap; }
    .msg-acts { display: flex; gap: 2px; opacity: 0; transition: opacity .15s ease; }
    .msg:hover .msg-acts, .msg:focus-within .msg-acts { opacity: 1; }
    @media (hover: none) { .msg-acts { opacity: .75; } }
    .msg-act {
      width: 30px; height: 30px; padding: 0; flex: none;
      display: inline-flex; align-items: center; justify-content: center;
      border: none; border-radius: 9px; background: transparent;
      color: var(--muted); cursor: pointer;
      transition: background .12s ease, color .12s ease;
    }
    .msg-act:hover { background: #eef0f6; color: #3f475e; }
    .msg.user .msg-act:hover { background: #e0f2fe; color: #075985; }
    .msg-act svg { width: 15px; height: 15px; }

    /* ===== 引用条 ===== */
    .quote-bar {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 8px; padding: 8px 12px;
      background: #eef2ff; border: 1px solid #c7d2fe; border-radius: 10px;
      font-size: 12px; color: #3730a3;
    }
    .quote-bar[hidden] { display: none; }
    .quote-bar .q-role { font-weight: 600; flex-shrink: 0; }
    .quote-bar .q-body { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .quote-bar button { border: none; background: transparent; color: var(--muted); cursor: pointer; font-size: 13px; padding: 0 4px; flex-shrink: 0; }

    /* ===== 文本打开弹窗 ===== */
    .text-modal { width: min(640px, 100%); }
    .text-modal .modal-body pre {
      margin: 0; white-space: pre-wrap; word-break: break-word;
      font-family: inherit; font-size: 13px; line-height: 1.65; color: var(--text);
    }
    .text-modal .modal-body .text-meta { font-size: 11px; color: var(--muted); margin-bottom: 8px; }
    .typing { display: inline-flex; gap: 5px; align-items: center; padding: 6px 0; }
    .typing span {
      width: 7px; height: 7px; border-radius: 50%; background: #a5aec6;
      animation: blink 1.2s infinite ease-in-out;
    }
    .typing span:nth-child(2) { animation-delay: .15s; }
    .typing span:nth-child(3) { animation-delay: .3s; }
    @keyframes blink {
      0%, 80%, 100% { opacity: .3; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-3px); }
    }

    /* ===== 输入区 ===== */
    .composer-wrap { padding: 8px 20px 20px; }
    .composer {
      max-width: 840px; margin: 0 auto; background: var(--card);
      border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow);
      padding: 12px 14px; display: flex; flex-direction: column; gap: 10px;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .composer:focus-within { border-color: #a5b4fc; box-shadow: 0 0 0 4px rgba(99,102,241,.10), var(--shadow); }
    .composer.dragover { border-color: #818cf8; box-shadow: 0 0 0 4px rgba(99,102,241,.18); }
    .composer textarea {
      width: 100%; border: none; outline: none; resize: none;
      min-height: 54px; max-height: 190px; padding: 8px 6px;
      background: transparent; color: var(--text); line-height: 1.55; font-size: 14.5px;
    }
    .composer-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .composer-left, .composer-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .chip-files { display: flex; flex-wrap: wrap; gap: 6px; min-height: 0; }
    .file-chip {
      font-size: 12px; background: #f1f3f8; border-radius: 8px; padding: 5px 9px;
      display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); color: #3d4763;
    }
    .file-chip button { border: none; background: transparent; color: var(--muted); padding: 0 3px; font-size: 14px; }
    .file-chip button:hover { color: var(--bad); }
    .mode-select {
      border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px;
      background: #fff; color: var(--muted); font-size: 12.5px; outline: none;
    }
    .mode-select:focus { border-color: #a5b4fc; }
    .send-btn {
      background: linear-gradient(135deg, #4f46e5, #6366f1); color: #fff;
      border: none; border-radius: 999px; padding: 9px 18px; font-weight: 600;
      min-width: 76px; box-shadow: 0 8px 18px -8px rgba(79,70,229,.55);
      transition: filter .15s ease, transform .1s ease;
    }
    .send-btn:hover { filter: brightness(1.07); }
    .send-btn:active { transform: scale(.98); }
    .send-btn:disabled { opacity: .55; cursor: not-allowed; }
    .foot-note { max-width: 840px; margin: 10px auto 0; text-align: center; font-size: 11.5px; color: var(--muted); }
  </style>

<!-- ===== Iris 入场层样式 ===== -->
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap">
<style id="entryStyle">
  #entryLayer{position:fixed;inset:0;z-index:2147483000;background:#050505;overflow:hidden;font-family:'Cinzel','EntrySerif','Times New Roman',serif;-webkit-font-smoothing:antialiased;user-select:none;background-image:url('/ui/assets/iris_enter.jpg'),url('assets/iris_enter.jpg');background-size:cover;background-position:center 30%;}
  #entryCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
  #entryShatter{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0;transition:opacity .15s ease;background:radial-gradient(circle at 50% 50%,transparent 25%,rgba(0,0,0,.75) 100%);}
  #entryShatter.active{opacity:1;}
  #entryUI{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:clamp(48px,10vh,96px);pointer-events:none;}
  #entryUI>*{pointer-events:auto;}
  #entryTitle{font-size:clamp(3.4rem,12vw,7.5rem);font-weight:500;letter-spacing:.05em;line-height:1;color:#fff;text-shadow:0 0 40px rgba(255,255,255,.22),0 0 110px rgba(212,175,55,.16);opacity:0;transform:translateY(18px);animation:entryTitleIn 2.4s cubic-bezier(.22,.61,.36,1) 1s forwards;}
  @keyframes entryTitleIn{to{opacity:1;transform:translateY(0);}}
  #entrySub{margin-top:10px;font-family:'Cormorant Garamond','Times New Roman',serif;font-style:italic;font-size:clamp(.8rem,1.3vw,1rem);letter-spacing:.28em;color:#a89572;opacity:0;animation:entryFadeUp 1.6s ease 1.9s forwards;}
  @keyframes entryFadeUp{from{opacity:0;transform:translateY(6px);}to{opacity:.9;transform:translateY(0);}}
  #entryBtn{position:relative;margin-top:clamp(26px,4vh,42px);padding:15px 58px;background:linear-gradient(180deg,#1a1408,#0a0704);border:1px solid #6b5528;color:#f5e6c8;font-family:inherit;font-size:.72rem;font-weight:600;letter-spacing:.5em;text-indent:.5em;text-transform:uppercase;cursor:pointer;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.9),inset 0 1px 0 rgba(212,175,55,.2),0 0 0 1px rgba(107,85,40,.5);opacity:0;transition:all .55s cubic-bezier(.22,.61,.36,1);animation:entryFadeUp 1.6s ease 2.4s forwards;}
  #entryBtn:hover{border-color:#d4af37;color:#fff;transform:translateY(-2px);box-shadow:0 18px 50px rgba(0,0,0,.95),inset 0 1px 0 rgba(212,175,55,.5),0 0 42px rgba(212,175,55,.25);}
  #entryBtn::before{content:'';position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(245,230,200,.32),transparent);transform:skewX(-25deg);transition:left 1s cubic-bezier(.22,.61,.36,1);}
  #entryBtn:hover::before{left:130%;}
  #entryBtn:disabled{cursor:default;opacity:.35;}
  #entryHint{margin-top:26px;font-size:.58rem;letter-spacing:.38em;color:#5a4d33;text-transform:uppercase;opacity:0;animation:entryFadeUp 1.4s ease 3.1s forwards;}
  #entryLayer .entry-vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 42%,transparent 26%,rgba(0,0,0,.88) 100%);}
  #entryLayer .entry-grain{position:absolute;inset:0;pointer-events:none;opacity:.35;mix-blend-mode:overlay;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.12'/%3E%3C/svg%3E");}
  #entryLoading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#050505;color:#6b5528;letter-spacing:.5em;font-size:.68rem;transition:opacity .8s ease;z-index:5;}
  #entryLoading.hidden{opacity:0;pointer-events:none;}
  #entryLayer.done{opacity:0;visibility:hidden;transition:opacity .9s ease .05s,visibility 0s 1s;}
  #entryLayer.done #entryUI,#entryLayer.done .entry-vig,#entryLayer.done .entry-grain{pointer-events:none;}
  #entryLayer.done #entryCanvas,#entryLayer.done #entryShatter,#entryLayer.done #entryUI,#entryLayer.done .entry-vig,#entryLayer.done .entry-grain{opacity:0;transition:opacity .7s ease;}
  /* ===== 主界面暗黑主题：与 Iris 入场页同调 ===== */
  :root{
    --bg:#0f1116; --bg-soft:#161a22; --sidebar:#0b0e14;
    --sidebar-text:#e8e2d0; --sidebar-muted:#8a8574;
    --card:#151922; --line:#262c3a; --text:#e8e6e0; --muted:#9aa0ae;
    --primary:#c9a227; --primary-hover:#e0bc45; --primary-soft:rgba(201,162,39,.14);
    --accent:#c9a227; --user-bg:#1e2530; --user-line:#3a4556;
    --error-bg:#331a1a; --error-line:#6b3232; --error-text:#f0b4b4;
  }
  body{background:var(--bg);}
  .btn-light{background:#1a1f2a;color:var(--text);border-color:var(--line);}
  .btn-light:hover{background:#232a38;}
  .btn-icon{background:#151922;color:var(--text);border-color:var(--line);}
  .btn-icon:hover{background:#232a38;}
  .chat::-webkit-scrollbar-thumb{background:#3a4256;}
  .file-dl-chip{background:#1b212c;border-color:var(--line);color:var(--text);}
  .file-dl-chip:hover{background:#252d3c;}
  .msg-act{color:var(--muted);}
  .msg-act:hover{background:#232a38;color:var(--text);}
  .msg.user .msg-act:hover{background:#253242;color:#cfe3f5;}
  .quote-bar{background:rgba(201,162,39,.08);border-color:#4a3d1a;}
  .ctx-chip{background:#1b212c;}
  input,textarea{background:#151922;color:var(--text);}
  /* ===== 白金暖白主题（米白底 + 金色点缀，不暗黑） ===== */
  :root{
    --bg:#f5efe2; --bg-soft:#faf6ec; --sidebar:#efe7d3;
    --card:#fffdf7; --line:#e2d6ba; --text:#3a2f1c; --muted:#8a7d62;
    --primary:#b8941f; --primary-hover:#d4af37; --primary-soft:rgba(184,148,31,.12);
    --user-bg:#f0e3bd; --user-line:#d4b96a;
    --gold:#b8941f; --cream:#fffdf7;
  }
  body{background:linear-gradient(180deg,#faf6ec 0%,#f3ecd9 100%);color:var(--text);}
  /* 侧栏 */
  .sidebar{background:linear-gradient(180deg,#efe7d3 0%,#e8dfc6 100%);border-right:1px solid #e2d6ba;}
  .brand h1{color:#3a2f1c;letter-spacing:.02em;}
  .brand p{color:var(--muted);}
  .brand-mark{background:linear-gradient(135deg,#c9a227,#8a6d1a);box-shadow:0 4px 14px rgba(184,148,31,.25);}
  .btn-primary{background:linear-gradient(135deg,#c9a227,#9a7a1f);color:#1a1408;font-weight:600;border:none;box-shadow:0 4px 14px rgba(201,162,39,.25);}
  .btn-primary:hover{background:linear-gradient(135deg,#e0bc45,#b8941f);}
  /* 侧栏折叠（桌面端） */
  .app.sidebar-collapsed .sidebar{width:68px !important;}
  .app.sidebar-collapsed .sidebar .brand>div:not(.brand-mark),
  .app.sidebar-collapsed .sidebar .session-head,
  .app.sidebar-collapsed .sidebar .sess-search,
  .app.sidebar-collapsed .sidebar .sessions,
  .app.sidebar-collapsed .sidebar .side-foot{display:none;}
  .app.sidebar-collapsed .sidebar .brand{justify-content:center;}
  .app.sidebar-collapsed .btn-block{margin:12px auto;padding:10px;}
  .app.sidebar-collapsed .btn-block{font-size:0;}
  .app.sidebar-collapsed .btn-block::after{content:"+";font-size:18px;}
  /* 会话项 */
  .sess{border-radius:10px;transition:background .15s;}
  .sess:hover{background:rgba(184,148,31,.1);}
  .sess.active{background:rgba(184,148,31,.16);}
  .sess .t{color:var(--text);}
  .sess .s{color:var(--muted);}
  .sess-op{color:var(--muted);border-radius:6px;}
  .sess-op:hover{background:rgba(184,148,31,.18);color:var(--gold);}
  /* 主区顶栏 */
  .topbar{background:transparent;border-bottom:1px solid #e2d6ba;}
  .topbar h2{color:#3a2f1c;}
  .topbar .hint{color:var(--muted);}
  /* 豆包风输入区 */
  .composer{background:#fffdf7;border:1px solid #e2d6ba;border-radius:18px;box-shadow:0 8px 30px rgba(120,95,30,.1);padding:12px 14px;}
  .composer textarea{background:transparent;border:none;color:var(--text);resize:none;line-height:1.6;}
  .composer textarea::placeholder{color:#b0a284;}
  .composer-bar{border-top:1px solid #ece3cc;margin-top:8px;padding-top:10px;}
  .composer-bar .btn-light{background:#f5eed8;border:1px solid #e2d6ba;color:var(--text);border-radius:10px;}
  .composer-bar .btn-light:hover{background:rgba(184,148,31,.15);}
  .mode-select,.composer select{background:#fffdf7;color:var(--text);border:1px solid #e2d6ba;border-radius:10px;}
  .send-btn{background:linear-gradient(135deg,#c9a227,#9a7a1f);color:#fff;border:none;font-weight:600;border-radius:12px;box-shadow:0 4px 16px rgba(184,148,31,.3);transition:transform .15s,box-shadow .15s;}
  .send-btn:hover{transform:translateY(-1px);box-shadow:0 6px 22px rgba(184,148,31,.45);}
  .foot-note{color:#a89a78;}
  /* 消息气泡（豆包风） */
  .avatar{display:none !important;}
  .msg{margin:22px 0;display:flex;}
  .msg.user{justify-content:flex-end;flex-direction:row;}
  .msg.user .bubble{
    background:#f0e3bd;border:1px solid #d4b96a;border-radius:18px;
    padding:11px 16px;color:#3a2f1c;max-width:min(100%,720px);
    border-bottom-right-radius:6px;box-shadow:none;
  }
  .msg.bot .bubble{background:transparent;border:none;color:var(--text);padding:4px 0;max-width:min(100%,860px);box-shadow:none;}
  .msg-act{opacity:0;transition:opacity .15s,background .15s;border-radius:8px;}
  .msg:hover .msg-act{opacity:1;}
  .msg-act:hover{background:rgba(184,148,31,.14);color:var(--gold);}
  .chat::-webkit-scrollbar{width:8px;}
  .chat::-webkit-scrollbar-thumb{background:#d4c6a0;border-radius:8px;}
  /* 引用来源 chips */
  .sources{border-top-color:#e2d6ba;color:var(--muted);}
  .sources .src-title{color:var(--gold);}
  .src-chip{background:#f5eed8;border:1px solid #e2d6ba;color:#5a4a2a;border-radius:8px;}
  .file-dl-chip{background:#f5eed8 !important;border-color:#d4b96a !important;color:#5a4a2a !important;}
  .file-dl-chip:hover{background:#ebdcb0 !important;}
  /* 状态点 / 底部按钮 */
  .status-pill .dot i{background:var(--gold);}
  .side-actions .btn-ghost{color:var(--muted);border-radius:10px;}
  .side-actions .btn-ghost:hover{background:rgba(184,148,31,.15);color:var(--gold);}
  /* 侧栏：会话列表独立滚动，底部固定不被挤出 */
  .sidebar{min-height:0;overflow:hidden;}
  .sidebar > *{flex:none;}
  .sessions{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;}
  .side-foot{flex:none;}
  /* 输入框/下拉在浅色下 */
  input,textarea{background:#fffdf7 !important;color:var(--text) !important;}
  .btn-icon{background:transparent;color:var(--text);}
  .btn-light{background:#f5eed8;color:var(--text);}
</style>

</head>
<body>

<!-- ===== Iris 入场层 ===== -->
<div id="entryLayer">
  <canvas id="entryCanvas"></canvas>
  <canvas id="entryShatter"></canvas>
  <div class="entry-vig"></div>
  <div class="entry-grain"></div>
  <div id="entryUI">
    <h1 id="entryTitle">Iris</h1>
    <p id="entrySub">The Blind Sovereign of the Golden Crown</p>
    <button id="entryBtn" type="button">Enter</button>
    <div id="entryHint">Click to Break the Veil</div>
  </div>
  <div id="entryLoading">LOADING</div>
</div>

  <div class="backdrop" id="backdrop"></div>
  <div class="app">
    <!-- 侧栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="M12 22V12"/><path d="M3 7l9 5 9-5"/></svg>
        </div>
        <div>
          <h1>企业私有知识库</h1>
          <p>检索增强 · 表查询 · 智能体</p>
        </div>
      </div>

      <button class="btn btn-primary btn-block" id="btnNew" type="button">＋ 新对话</button>

      <div class="session-head">
        <span>历史会话</span>
        <button class="btn btn-ghost" type="button" id="btnClearSess" style="padding:4px 8px;font-size:11px">清空列表</button>
      </div>
      <div class="sess-search">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="flex:none"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="sessSearch" type="text" placeholder="搜索会话" autocomplete="off" />
      </div>
      <div class="sessions" id="sessionList"></div>

      <div class="side-foot">
        <div class="status-pill" id="healthDots">
          <span class="dot" id="dotRag"><i></i>知识索引</span>
          <span class="dot" id="dotDb"><i></i>业务库</span>
        </div>

        <div class="side-actions">
          <button class="btn btn-ghost" type="button" id="btnWorkspace" title="查看并下载当前会话工作区文件（Iris 生成 / 上传的附件）">工作区文件</button>
          <button class="btn btn-ghost" type="button" id="btnRebuild" title="重建叙述文档索引">重建索引</button>
          <button class="btn btn-ghost" type="button" id="btnIngest" title="导入 data/raw 下表格">导入表数据</button>
        </div>

        <details>
          <summary>连接与高级</summary>
          <div class="cfg">
            <div>
              <label>API 地址</label>
              <input id="base" value="" placeholder="默认当前站点" />
            </div>
            <div>
              <label>API Key（可选）</label>
              <input id="key" type="password" placeholder="开发模式可留空" autocomplete="off" />
            </div>
            <div>
              <label>默认路由</label>
              <select id="force">
                <option value="">自动识别（推荐）</option>
                <option value="rag">仅知识库</option>
                <option value="hybrid">知识库 + 表</option>
                <option value="sql">仅 SQL</option>
                <option value="agent">智能体</option>
                <option value="chat">闲聊</option>
              </select>
            </div>
            <button class="btn btn-ghost btn-block" type="button" id="btnHealth">刷新状态</button>
          </div>
        </details>
      </div>
    </aside>

    <!-- 工作区文件弹窗 -->
    <div class="modal-mask" id="wsMask" hidden>
      <div class="modal">
        <div class="modal-head">
          <b>工作区文件</b>
          <span class="hint" id="wsSess"></span>
          <button class="btn-icon" type="button" id="wsClose" aria-label="关闭">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <div class="modal-body" id="wsList"></div>
        <div class="modal-foot">
          <span class="hint">文件保存在服务器该会话的工作区中，下载后落到你的设备。</span>
          <button class="btn btn-light" type="button" id="wsRefresh">刷新</button>
        </div>
      </div>
    </div>

    <!-- 文本打开弹窗 -->
    <div class="modal-mask" id="textMask" hidden>
      <div class="modal text-modal">
        <div class="modal-head">
          <b id="textTitle">消息文本</b>
          <span class="hint" id="textMeta"></span>
          <button class="btn-icon" type="button" id="textClose" aria-label="关闭">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <div class="modal-body" id="textBody"></div>
        <div class="modal-foot">
          <span class="hint">全文查看，可复制或下载为 .txt</span>
          <button class="btn btn-light" type="button" id="textCopy">复制</button>
          <button class="btn btn-light" type="button" id="textDownload">下载 .txt</button>
        </div>
      </div>
    </div>

    <!-- 主聊天 -->
    <section class="main">
      <header class="topbar">
        <div class="left">
          <button class="btn-icon menu-btn" type="button" id="btnMenu" aria-label="菜单">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <div style="min-width:0">
            <h2 id="chatTitle">新对话</h2>
            <div class="hint" id="chatSub">基于企业文档与业务表作答 · 支持附件</div>
          </div>
        </div>
        <div class="hint" id="sessIdLabel"></div>
      </header>

      <div class="chat" id="chatScroll">
        <div class="chat-inner" id="messages"></div>
      </div>

      <div class="composer-wrap">
        <div class="composer" id="composer">
          <div class="quote-bar" id="quoteBar" hidden>
            <span class="q-role" id="quoteRole"></span>
            <span class="q-body" id="quoteText"></span>
            <button type="button" id="quoteCancel" title="取消引用" aria-label="取消引用">×</button>
          </div>
          <div class="chip-files" id="fileChips"></div>
          <textarea id="input" rows="2" placeholder="输入问题，或上传文档 / 表格 / 代码… Enter 发送，Shift+Enter 换行"></textarea>
          <div class="composer-bar">
            <div class="composer-left">
              <label class="btn btn-light" style="padding:6px 12px;font-size:13px;cursor:pointer">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px"><path d="M21.44 11.05 12.25 20.24a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                ＋ 附件
                <input id="file" type="file" multiple hidden />
              </label>
              <select class="mode-select" id="forceBar" title="覆盖自动分流">
                <option value="">自动</option>
                <option value="rag">知识库</option>
                <option value="hybrid">混合</option>
                <option value="sql">SQL</option>
                <option value="agent">智能体</option>
                <option value="chat">闲聊</option>
              </select>
            </div>
            <div class="composer-right">
              <button class="send-btn" type="button" id="btnSend">
                发送
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>
              </button>
            </div>
          </div>
        </div>
        <div class="foot-note">回答由大模型生成，重要决策请核对引用来源与表数据。内容仅在您的环境内处理。</div>
      </div>
    </section>
  </div>

<script>
(() => {
  const LS_KEY = "pkb.ui.v1";
  const $ = (id) => document.getElementById(id);

  const state = {
    sessions: [],
    activeId: null,
    files: [],
    busy: {}, // sessionId -> true，按会话独立发送锁
    quote: null, // { role: "user"|"bot", content: "..." }
  };

  function syncSendBtn() {
    const s = active();
    $("btnSend").disabled = !!(s && state.busy[s.id]);
  }

  function uid() {
    return "s-" + Math.random().toString(36).slice(2, 10);
  }
  function nowLabel() {
    const d = new Date();
    return d.toLocaleString("zh-CN", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
  }
  function load() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (!raw) return;
      const data = JSON.parse(raw);
      if (data.sessions) state.sessions = data.sessions;
      if (data.activeId) state.activeId = data.activeId;
      if (data.base != null) $("base").value = data.base;
      if (data.key != null) $("key").value = data.key;
      if (data.force != null) {
        $("force").value = data.force;
        $("forceBar").value = data.force;
      }
    } catch (_) {}
  }
  function save() {
    localStorage.setItem(LS_KEY, JSON.stringify({
      sessions: state.sessions,
      activeId: state.activeId,
      base: $("base").value,
      key: $("key").value,
      force: $("force").value || $("forceBar").value,
    }));
  }

  function apiBase() {
    const v = ($("base").value || "").trim().replace(/\/$/, "");
    if (v) return v;
    return location.origin;
  }
  function headersJson() {
    const h = { "Content-Type": "application/json" };
    const k = $("key").value.trim();
    if (k) h["X-API-Key"] = k;
    return h;
  }
  function headersMulti() {
    const h = {};
    const k = $("key").value.trim();
    if (k) h["X-API-Key"] = k;
    return h;
  }

  function active() {
    return state.sessions.find((s) => s.id === state.activeId) || null;
  }
  function ensureSession() {
    if (active()) return active();
    return newSession(false);
  }
  function newSession(select = true) {
    const s = {
      id: uid(),
      title: "新对话",
      updatedAt: Date.now(),
      messages: [],
    };
    state.sessions.unshift(s);
    if (select) state.activeId = s.id;
    save();
    renderSessions();
    renderMessages();
    return s;
  }

  function renderSessions() {
    const box = $("sessionList");
    box.innerHTML = "";
    const q = ($("sessSearch") ? $("sessSearch").value : "").trim().toLowerCase();
    const list = q
      ? state.sessions.filter((s) => (s.title || "").toLowerCase().includes(q))
      : state.sessions;
    if (!list.length) {
      box.innerHTML = '<div style="padding:12px;color:#9ca3af;font-size:12px">' + (q ? "无匹配会话" : "暂无会话，点击上方开始") + "</div>";
      return;
    }
    for (const s of list) {
      const b = document.createElement("div");
      b.className = "sess" + (s.id === state.activeId ? " active" : "");
      b.dataset.id = s.id;
      const main = document.createElement("div");
      main.className = "sess-main";
      main.innerHTML = `<span class="t"></span><span class="s"></span>`;
      main.querySelector(".t").textContent = s.title || "未命名";
      main.querySelector(".s").textContent = new Date(s.updatedAt || Date.now()).toLocaleString("zh-CN", {
        month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit",
      });
      main.onclick = () => {
        state.activeId = s.id;
        save();
        renderSessions();
        renderMessages();
        closeMobile();
      };
      const ops = document.createElement("div");

      const mkOp = (title, html, cls, fn) => {

        o.className = "sess-op" + (cls ? " " + cls : "");
        o.title = title;
        o.innerHTML = html;
        o.onclick = (ev) => { ev.stopPropagation(); fn(); };

      };
      mkOp("重命名", '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>', "", () => renameSession(s.id));
      mkOp("删除", '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>', "del", () => deleteSession(s.id));

  function renameSession(id) {
    const s = state.sessions.find((x) => x.id === id);
    if (!s) return;
    const row = Array.from($("sessionList").querySelectorAll(".sess")).find((el) => el.dataset.id === id);
    if (!row || row.querySelector(".rename-input")) return;
    const tEl = row.querySelector(".t");
    if (!tEl) return;
    const input = document.createElement("input");
    input.type = "text";
    input.className = "rename-input";
    input.value = s.title || "";
    input.maxLength = 60;
    tEl.replaceWith(input);
    input.focus();
    input.select();
    let done = false;
    const commit = (saveIt) => {
      if (done) return;
      done = true;
      const v = input.value.trim();
      s.title = v || "未命名";
      if (saveIt) {
        save();
        renderSessions();
      } else {
        renderSessions();
      }
    };
    input.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter") { ev.preventDefault(); commit(true); }
      else if (ev.key === "Escape") { ev.stopPropagation(); commit(false); }
    });
    input.addEventListener("blur", () => commit(true));
    input.addEventListener("click", (ev) => ev.stopPropagation());
  }

  function deleteSession(id) {
    const idx = state.sessions.findIndex((x) => x.id === id);
    if (idx < 0) return;
    if (!confirm("删除该会话？此操作不可恢复。")) return;
    state.sessions.splice(idx, 1);
    if (state.activeId === id) {
      state.activeId = state.sessions.length ? state.sessions[0].id : null;
    }
    save();
    renderSessions();
    renderMessages();
  }

  function attachFileChips(bub, text) {
    const re = /data\/chat_uploads\/([^/\s>]+)\/([^\s]+)/g;
    let mm;
    const found = [];
    while ((mm = re.exec(text || "")) !== null) {
      const dir = mm[1];
      let rel = mm[2].replace(/[`"'。，、；,.;:)\]}>]+$/, "");
      const sess = dir.indexOf("_") >= 0 ? dir.split("_", 2)[1] : dir;
      found.push({ sess: sess, rel: rel });
    }
    if (!found.length) return;
    const wrap = document.createElement("div");
    wrap.className = "file-dl-row";
    for (const f of found) {
      const chip = document.createElement("button");
      chip.type = "button";
      chip.className = "file-dl-chip";
      chip.innerHTML = '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-1px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>下载 ' + esc(f.rel.split("/").pop());
      chip.onclick = () => downloadFile(f.sess, f.rel);
      wrap.appendChild(chip);
    }
    bub.appendChild(wrap);
  }

  function esc(s) {
    return String(s ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function roleName(r) { return r === "user" ? "我" : "Iris"; }

  function fmtMsgTime(ts) {
    const d = new Date(ts);
    if (isNaN(d.getTime())) return "";
    const now = new Date();
    const hm = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
    const startToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const startYest = new Date(startToday.getTime() - 86400000);
    if (d >= startToday) return "今天 " + hm;
    if (d >= startYest) return "昨天 " + hm;
    if (d.getFullYear() === now.getFullYear()) return d.getMonth() + 1 + "/" + d.getDate() + " " + hm;
    return d.getFullYear() + "/" + (d.getMonth() + 1) + "/" + d.getDate() + " " + hm;
  }

  function fallbackCopy(text, done) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); done(); } catch (_) { }
    ta.remove();
  }

  function copyMsg(m, btn) {
    const text = m.content || "";
    const done = () => {
      if (btn) {
        const old = btn.innerHTML;
        btn.innerHTML = "已复制";
        setTimeout(() => { btn.innerHTML = old; }, 1200);
      }
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
    } else {
      fallbackCopy(text, done);
    }
  }

  function downloadTxt(text, name) {

    a.href = url;

        const icoNew = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>';

      const rag = $("dotRag");

      rag.className = "dot " + (j.rag_index_ready ? "ok" : "bad");

  async function adminPost(path, body) {
    const r = await fetch(apiBase() + path, {
      method: "POST",
      headers: headersJson(),
      body: body === undefined ? undefined : JSON.stringify(body ?? {}),
    });
    const t = await r.text();
    let j;
    try { j = JSON.parse(t); } catch { throw new Error(t || r.statusText); }
    if (!r.ok || j.ok === false) {
      const msg = (j.error && j.error.message) || t || "请求失败";
      throw new Error(msg);
    }
    return j;
  }

  async function send() {
    const text = $("input").value.trim();
    if (!text && !state.files.length && !state.quote) return;

    const s = ensureSession();
    if (state.busy[s.id]) return; // 只锁当前会话，不影响其他对话
    if (s.title === "新对话" && text) {
      s.title = text.slice(0, 28) + (text.length > 28 ? "…" : "");
    }

    const quoted = state.quote;
    let payload = text;
    if (quoted) {
      const head = "【引用" + roleName(quoted.role) + "】" + (quoted.content || "").replace(/\n+/g, " ").slice(0, 300);
      payload = (head + (text ? "\n\n" + text : ""));
    }

    const userMsg = {
      role: "user",
      content: text || (quoted ? "（引用" + roleName(quoted.role) + "消息）" : "（仅上传附件）"),
      meta: state.files.length ? { attachments: state.files.map((f) => ({ filename: f.name })) } : null,
      ts: Date.now(),
    };
    s.messages.push(userMsg);
    const pending = { role: "assistant", content: "", pending: true, ts: Date.now() };
    s.messages.push(pending);
    s.updatedAt = Date.now();
    $("input").value = "";
    state.quote = null;
    renderQuoteBar();
    const filesSnap = state.files.slice();
    setFiles([]);
    state.busy[s.id] = true;
    syncSendBtn();
    save();
    renderSessions();
    renderMessages();

    try {
      const fd = new FormData();
      fd.append("message", payload);
      fd.append("session_id", s.id);
      fd.append("use_memory", "true");
      fd.append("unpack_paste", "true");
      const force = $("forceBar").value || $("force").value;
      if (force) fd.append("force_mode", force);
      for (const f of filesSnap) fd.append("files", f, f.name);

      const r = await fetch(apiBase() + "/v1/chat", {
        method: "POST",
        headers: headersMulti(),
        body: fd,
      });
      const raw = await r.text();
      let data;
      try { data = JSON.parse(raw); } catch { throw new Error(raw || "无效响应"); }

      // 去掉 pending
      s.messages = s.messages.filter((m) => !m.pending);

      if (!r.ok || data.ok === false) {
        const err = (data && data.error) || {};
        s.messages.push({
          role: "assistant",
          error: true,
          content: (err.code ? err.code + " · " : "") + (err.message || raw || "请求失败"),
          meta: err.stage ? { reason: err.stage } : null,
          ts: Date.now(),
        });
      } else {
        const res = data.result || {};
        s.messages.push({
          role: "assistant",
          content: data.answer || "",
          meta: {
            mode: data.mode,
            reason: data.plan && data.plan.reason,
            timing: data.timing,
            sources: res.sources || [],
            cite_ids: res.cite_ids || [],
            sql: res.sql,
            attachments: data.attachments || [],
          },
          ts: Date.now(),
        });
      }
    } catch (e) {
      s.messages = s.messages.filter((m) => !m.pending);
      s.messages.push({
        role: "assistant",
        error: true,
        content: String(e.message || e),
        ts: Date.now(),
      });
    } finally {
      s.updatedAt = Date.now();
      delete state.busy[s.id];
      syncSendBtn();
      save();
      renderSessions();
      renderMessages();
      if (!$("wsMask").hidden) loadWorkspaceFiles();
      $("input").focus();
    }
  }

  function fmtSize(n) {
    if (n < 1024) return n + " B";
    if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
    return (n / 1048576).toFixed(1) + " MB";
  }

  async function downloadFile(sessionId, path) {
    try {
      const r = await fetch(apiBase() + "/v1/session/files/download?session_id=" + encodeURIComponent(sessionId) + "&path=" + encodeURIComponent(path), { headers: headersJson() });
      if (!r.ok) {
        const t = await r.text();
        let j;
        try { j = JSON.parse(t); } catch { j = null; }
        throw new Error((j && j.error && j.error.message) || "下载失败");
      }
      const blob = await r.blob();
      const a = document.createElement("a");
      const url = URL.createObjectURL(blob);
      a.href = url;
      a.download = path.split("/").pop();
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
    } catch (e) {
      alert(String(e.message || e));
    }
  }

  async function loadWorkspaceFiles() {
    const s = ensureSession();
    $("wsSess").textContent = "会话 " + s.id;
    const box = $("wsList");
    box.innerHTML = '<div class="hint" style="padding:12px">加载中…</div>';
    try {
      const r = await fetch(apiBase() + "/v1/session/files?session_id=" + encodeURIComponent(s.id), { headers: headersJson() });
      const t = await r.text();
      let j;
      try { j = JSON.parse(t); } catch { throw new Error(t || r.statusText); }
      if (!r.ok || j.ok === false) throw new Error((j.error && j.error.message) || "获取文件列表失败");
      const files = j.files || [];
      if (!files.length) {
        box.innerHTML = '<div class="hint" style="padding:12px">暂无文件 —— 让 Iris 建文件，或在本会话上传附件后，这里会出现可下载的文件。</div>';
        return;
      }
      box.innerHTML = "";
      for (const f of files) {
        const row = document.createElement("div");
        row.className = "ws-row";
        const info = document.createElement("div");
        info.className = "ws-info";
        info.innerHTML = '<div class="ws-name"></div><div class="hint"></div>';
        info.querySelector(".ws-name").textContent = f.path;
        info.querySelector(".hint").textContent = fmtSize(f.size) + " · " + new Date(f.mtime).toLocaleString("zh-CN", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
        const dl = document.createElement("button");
        dl.type = "button";
        dl.className = "btn btn-ghost";
        dl.textContent = "下载";
        dl.onclick = () => downloadFile(s.id, f.path);
        row.appendChild(info);
        row.appendChild(dl);
        box.appendChild(row);
      }
    } catch (e) {
      box.innerHTML = '<div class="hint" style="padding:12px">加载失败：' + esc(String(e.message || e)) + "</div>";
    }
  }

    $("btnRebuild").disabled = true;
    try {
      await adminPost("/v1/rag/rebuild");
      alert("知识索引重建完成");
      refreshHealth();
    } catch (e) { alert(String(e.message || e)); }
    finally { $("btnRebuild").disabled = false; }
  };
  $("btnIngest").onclick = async () => {
    $("btnIngest").disabled = true;
    try {
      await adminPost("/v1/sqlite/ingest", {});
      alert("表数据导入完成");
      refreshHealth();
    } catch (e) { alert(String(e.message || e)); }
    finally { $("btnIngest").disabled = false; }
  };

  $("quoteCancel").onclick = () => { state.quote = null; renderQuoteBar(); $("input").focus(); };
  $("textClose").onclick = closeText;
  $("textMask").onclick = (e) => { if (e.target === $("textMask")) closeText(); };
  $("textCopy").onclick = () => {
    const m = window.__textMsg;
    if (m) copyMsg(m);
  };
  $("textDownload").onclick = () => {
    const m = window.__textMsg;
    if (!m) return;
    const stamp = new Date().toISOString().slice(0, 10);
    downloadTxt(m.content || "", (roleName(m.role) === "我" ? "我" : "Iris") + "-" + stamp + ".txt");
  };

  $("input").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });
  $("file").addEventListener("change", () => {
    const add = Array.from($("file").files || []);
    setFiles(state.files.concat(add));
    $("file").value = "";
  });

  // sync force selects
  $("force").addEventListener("change", () => {
    $("forceBar").value = $("force").value;
    save();
  });
  $("forceBar").addEventListener("change", () => {
    $("force").value = $("forceBar").value;
    save();
  });
  ["base", "key"].forEach((id) => $(id).addEventListener("change", save));

  // drag drop on composer
  const comp = $("composer");
  ["dragenter", "dragover"].forEach((ev) => comp.addEventListener(ev, (e) => {
    e.preventDefault();
    comp.classList.add("dragover");
  }));
  ["dragleave", "drop"].forEach((ev) => comp.addEventListener(ev, (e) => {
    e.preventDefault();
    comp.classList.remove("dragover");
  }));
  comp.addEventListener("drop", (e) => {
    const fl = e.dataTransfer && e.dataTransfer.files;
    if (fl && fl.length) setFiles(state.files.concat(Array.from(fl)));
  });

  // init
  load();
  if (!state.sessions.length) newSession(true);
  else if (!active()) state.activeId = state.sessions[0].id;
  renderSessions();
  renderMessages();
  refreshHealth();
})();
</script>

<script id="entryScript">
(function () {
  var ENTRY_IMG = '/ui/assets/iris_enter.jpg';
  var ENTRY_KEY = 'iris_entry_seen_v1';
  var layer = document.getElementById('entryLayer');
  /* 已看过入场 → 直接进入主界面（首次访问才展示仪式） */
  try {
    if (localStorage.getItem(ENTRY_KEY)) {
      layer.style.display = 'none';
      return;
    }
  } catch (e) {}
  var loadingEl = document.getElementById('entryLoading');
  var btn = document.getElementById('entryBtn');
  var entered = false;
  var threeFailed = false;

  function finishEntry() {
    if (entered) return;
    entered = true;
    try { localStorage.setItem(ENTRY_KEY, '1'); } catch (e) {}
    layer.classList.add('done');
    setTimeout(function () { layer.style.display = 'none'; }, 1150);
  }

  /* 兜底：Three.js 或纹理加载失败也要能进 */
  btn.addEventListener('click', function () {
    if (entered) return;
    btn.disabled = true;
    /* 绝对兜底：任何动画异常都保证进入主界面 */
    setTimeout(finishEntry, 8000);
    if (threeFailed || !window.THREE) { finishEntry(); return; }
    startFlight();
  });

  /* ---- 卸载保护：加载完成前允许直接进入 ---- */
  var loadTimer = setTimeout(function () {
    loadingEl.classList.add('hidden');
    if (!window.THREE) { threeFailed = true; loadingEl.classList.add('hidden'); }
  }, 4000);

  /* ================= Three.js 场景（粒子 + 棋子 + 景深视差） ================= */
  function startThree() {
    if (!window.THREE) { threeFailed = true; return; }
    loadingEl.classList.add('hidden'); /* three 就绪立即揭掉 LOADING */
    var THREE = window.THREE;
    var canvas = document.getElementById('entryCanvas');
    var shatterCanvas = document.getElementById('entryShatter');
    var W = window.innerWidth, H = window.innerHeight;

    var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(W, H);

    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(45, W / H, 0.1, 100);
    camera.position.z = 8;

    /* 鼠标视差 */
    var mouse = { x: 0, y: 0, tx: 0, ty: 0 };
    function onPointer(cx, cy) {
      mouse.tx = (cx / W) * 2 - 1;
      mouse.ty = -(cy / H) * 2 + 1;
    }
    window.addEventListener('mousemove', function (e) { onPointer(e.clientX, e.clientY); });
    window.addEventListener('touchmove', function (e) {
      if (e.touches && e.touches[0]) onPointer(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    /* 金色尘埃粒子 */
    var N = 320;
    var pGeo = new THREE.BufferGeometry();
    var pPos = new Float32Array(N * 3);
    var pData = [];
    for (var i = 0; i < N; i++) {
      var x = (Math.random() - 0.5) * 16, y = (Math.random() - 0.5) * 12, z = (Math.random() - 0.5) * 6;
      pPos[i*3] = x; pPos[i*3+1] = y; pPos[i*3+2] = z;
      pData.push({ bx: x, by: y, bz: z, ph: Math.random() * 6.28, sp: Math.random() * 0.5 + 0.2 });
    }
    pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
    var pMat = new THREE.PointsMaterial({ color: 0xd4af37, size: 0.045, transparent: true, opacity: 0.65, blending: THREE.AdditiveBlending, depthWrite: false });
    var pts = new THREE.Points(pGeo, pMat);
    scene.add(pts);

    /* 白色国王棋子（LatheGeometry） */
    var profile = [];
    profile.push(new THREE.Vector2(0, 0)); profile.push(new THREE.Vector2(0.35, 0));
    profile.push(new THREE.Vector2(0.35, 0.08)); profile.push(new THREE.Vector2(0.28, 0.12));
    profile.push(new THREE.Vector2(0.28, 0.2)); profile.push(new THREE.Vector2(0.22, 0.25));
    profile.push(new THREE.Vector2(0.15, 0.35)); profile.push(new THREE.Vector2(0.13, 0.5));
    profile.push(new THREE.Vector2(0.16, 0.6)); profile.push(new THREE.Vector2(0.18, 0.7));
    profile.push(new THREE.Vector2(0.15, 0.8)); profile.push(new THREE.Vector2(0.1, 0.88));
    profile.push(new THREE.Vector2(0.08, 0.95)); profile.push(new THREE.Vector2(0.12, 1.02));
    profile.push(new THREE.Vector2(0.08, 1.08)); profile.push(new THREE.Vector2(0, 1.12));
    var piece = new THREE.Mesh(
      new THREE.LatheGeometry(profile, 32),
      new THREE.MeshStandardMaterial({ color: 0xf5f0e8, roughness: 0.35, metalness: 0.1, emissive: 0x2a2518, emissiveIntensity: 0.3 })
    );
    piece.position.set(-1.7, -0.4, 1.6);
    piece.scale.setScalar(0.62);
    scene.add(piece);

    /* 环境光 + 金色主光 + 冷色轮廓 */
    scene.add(new THREE.AmbientLight(0x1a1508, 0.9));
    var key = new THREE.DirectionalLight(0xd4af37, 2.2); key.position.set(-2, 3, 4); scene.add(key);
    var rim = new THREE.DirectionalLight(0x4a6b5a, 1.1); rim.position.set(3, 1, -3); scene.add(rim);

    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;

    /* 飞行参数 */
    var flying = false, flyT0 = 0, shattered = false, flightTimer = null;
    var startPos = new THREE.Vector3(), startScale = 1;
    var clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      var t = clock.getElapsedTime();
      mouse.x += (mouse.tx - mouse.x) * 0.05;
      mouse.y += (mouse.ty - mouse.y) * 0.05;

      /* 视差：CSS 背景轻微位移（景深层1）+ 相机轻微位移（景深层2） */
      var bgShiftX = mouse.x * 14, bgShiftY = mouse.y * 10;
      layer.style.backgroundPosition = 'calc(50% + ' + bgShiftX + 'px) calc(30% + ' + bgShiftY + 'px)';
      camera.position.x = mouse.x * 0.35;
      camera.position.y = mouse.y * 0.25;
      camera.lookAt(0, 0, 0);

      /* 粒子漂浮 */
      var arr = pGeo.attributes.position.array;
      for (var i = 0; i < N; i++) {
        var d = pData[i];
        arr[i*3] = d.bx + Math.sin(t * d.sp + d.ph) * 0.22;
        arr[i*3+1] = d.by + Math.cos(t * d.sp * 0.8 + d.ph) * 0.22;
        arr[i*3+2] = d.bz + Math.sin(t * d.sp * 0.6 + d.ph) * 0.12;
      }
      pGeo.attributes.position.needsUpdate = true;

      if (flying) {
        var el = performance.now() - flyT0;
        var f = Math.min(el / 1100, 1);
        var e = f * f * f; /* easeInCubic */
        piece.position.set(startPos.x * (1 - e), startPos.y * (1 - e), startPos.z + (7.6 - startPos.z) * e);
        piece.scale.setScalar(startScale + e * 1.9);
        piece.rotation.z = e * Math.PI * 3;
        piece.rotation.x = e * Math.PI * 1.6;
        if (f >= 1) { flying = false; triggerShatter(); }
      } else {
        piece.position.y = -0.4 + Math.sin(t * 1.5) * 0.07;
        piece.rotation.y = Math.sin(t * 0.8) * 0.25;
        piece.rotation.x = Math.sin(t * 0.6) * 0.08;
        piece.position.x = -1.7 + mouse.x * 0.12;
      }
      renderer.render(scene, camera);
    }
    animate();

    function startFlight() {
      flying = true;
      flyT0 = performance.now();
      startPos.copy(piece.position);
      startScale = piece.scale.x;
      /* 兜底：即使动画循环被节流/暂停（后台标签、节能），也保证转场完成 */
      if (flightTimer) clearTimeout(flightTimer);
      flightTimer = setTimeout(function () {
        if (!shattered) { flying = false; triggerShatter(); }
      }, 2800);
    }

    window.addEventListener('resize', function () {
      W = window.innerWidth; H = window.innerHeight;
      camera.aspect = W / H; camera.updateProjectionMatrix();
      renderer.setSize(W, H);
    });

    /* ---- 蛛网裂屏 ---- */
    function triggerShatter() {
      if (shattered) return;
      shattered = true;
      if (flightTimer) clearTimeout(flightTimer);
      var sc = shatterCanvas.getContext('2d');
      shatterCanvas.width = W; shatterCanvas.height = H;
      shatterCanvas.parentElement.classList.add('active');
      var cx = W / 2, cy = H / 2;

      var cracks = [];
      for (var i = 0; i < 16; i++) {
        var ang = (i / 16) * Math.PI * 2 + (Math.random() - 0.5) * 0.5;
        var segs = [], x = cx, y = cy, a = ang, dist = 0;
        var len = Math.max(W, H) * 0.9;
        while (dist < len) {
          a += (Math.random() - 0.5) * 0.3;
          var sl = 15 + Math.random() * 25;
          var nx = x + Math.cos(a) * sl, ny = y + Math.sin(a) * sl;
          segs.push({ x1: x, y1: y, x2: nx, y2: ny });
          x = nx; y = ny; dist += sl;
        }
        cracks.push(segs);
      }
      var rings = [];
      for (var r = 55; r < Math.max(W, H) * 0.75; r += 70 + Math.random() * 40) rings.push(r);

      var t0 = performance.now(), dur = 750;
      var done = false;
      /* 兜底：碎裂动画帧被节流时也强制收尾 */
      setTimeout(function () {
        if (!done) { sc.clearRect(0, 0, W, H); shatterCanvas.parentElement.classList.remove('active'); finishEntry(); }
      }, 1600);
      (function draw() {
        var p = Math.min((performance.now() - t0) / dur, 1);
        sc.clearRect(0, 0, W, H);
        sc.strokeStyle = 'rgba(255,255,255,0.9)';
        sc.lineWidth = 1.5;
        sc.shadowColor = 'rgba(200,220,255,0.8)';
        sc.shadowBlur = 8;
        for (var i = 0; i < cracks.length; i++) {
          sc.beginPath();
          var maxSeg = Math.floor(cracks[i].length * p);
          for (var j = 0; j < maxSeg; j++) {
            var s = cracks[i][j];
            if (j === 0) sc.moveTo(s.x1, s.y1);
            sc.lineTo(s.x2, s.y2);
          }
          sc.stroke();
        }
        sc.shadowBlur = 0;
        for (var k = 0; k < rings.length; k++) {
          var rp = Math.min((p - (k / rings.length) * 0.5 - 0.1) / 0.5, 1);
          if (rp <= 0) continue;
          sc.beginPath();
          sc.arc(cx, cy, rings[k] * rp, 0, Math.PI * 2);
          sc.strokeStyle = 'rgba(255,255,255,0.4)';
          sc.lineWidth = 1;
          sc.stroke();
        }
        var g = sc.createRadialGradient(cx, cy, 0, cx, cy, 60 + 150 * (1 - p));
        g.addColorStop(0, 'rgba(255,255,255,' + (0.85 * (1 - p)) + ')');
        g.addColorStop(1, 'rgba(255,255,255,0)');
        sc.fillStyle = g;
        sc.beginPath(); sc.arc(cx, cy, 210, 0, Math.PI * 2); sc.fill();
        if (p < 1) requestAnimationFrame(draw);
        else {
          done = true;
          setTimeout(function () { shatterCanvas.parentElement.classList.remove('active'); finishEntry(); }, 260);
        }
      })();
    }
  }

  /* 异步加载 three（自托管优先，CDN 兜底），失败则降级为纯静态入场 */
  function loadThree(srcs, i) {
    if (i >= srcs.length) {
      threeFailed = true;
      loadingEl.classList.add('hidden');
      return;
    }
    var s = document.createElement('script');
    s.src = srcs[i];
    s.onload = function () {
      try { startThree(); }
      catch (e) { threeFailed = true; loadingEl.classList.add('hidden'); }
    };
    s.onerror = function () { loadThree(srcs, i + 1); };
    document.head.appendChild(s);
  }
  loadThree(['/ui/assets/three.min.js', 'assets/three.min.js',
             'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js'], 0);

  clearTimeout(loadTimer);
  /* 入场 UI 立即可见：不等 three（粒子后台静默加载），LOADING 400ms 内消失 */
  setTimeout(function () { loadingEl.classList.add('hidden'); }, 400);

  /* ===== 侧栏折叠（桌面端）：点 topbar 菜单按钮切换 ===== */
  (function () {
    var app = document.querySelector('.app');
    var btn = document.getElementById('btnMenu');
    if (!app || !btn) return;
    btn.addEventListener('click', function () {
      /* 宽屏才折叠；窄屏保持原有抽屉行为 */
      if (window.innerWidth < 900) return;
      app.classList.toggle('sidebar-collapsed');
    });
  })();
})();
</script>
