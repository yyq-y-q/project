[project]
name = "project"
version = "0.2.0"
description = "Enterprise private knowledge base: RAG + SQLite + Agent + API"
readme = "README.md"
authors = [
    { name = "yyq_qqy", email = "yyq2005223@qq.com" }
]
requires-python = ">=3.14"
dependencies = [
    "authlib>=1.3.0",
    "chromadb>=1.5.9",
    "click>=8.5.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "itsdangerous>=2.2.0",
    "python-multipart>=0.0.9",
    "jieba>=0.42.1",
    "langchain-text-splitters>=1.1.2",
    "numpy>=2.5.3",
    "openai>=3.19.2",
    "openpyxl>=3.1.5",
    "pyjwt[crypto]>=2.8.0",
    "python-docx>=1.1.2",
    "python-dotenv>=1.2.3",
    "pypdf>=5.0.0",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.1.0",
    "sqlglot>=30.19.0",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
myagent = "agent.main:main"
mykb = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent", "src/rag", "src/sqlite_tool", "src/app"]

# 把 src/<pkg> 装成顶层 import：import agent / rag / sqlite_tool / app
[tool.hatch.build.targets.wheel.sources]
"src/agent" = "agent"
"src/rag" = "rag"
"src/sqlite_tool" = "sqlite_tool"
"src/app" = "app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
