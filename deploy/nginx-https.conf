# HTTPS 反代（docker compose with-proxy 使用；裸机请用 deploy/nginx.conf 或改 upstream）
# 证书：deploy/certs/fullchain.pem + privkey.pem（生成方式见 deploy/certs/README.md）
# upstream 名 kb 适配 docker compose

upstream private_kb {
    server kb:8000;
    keepalive 16;
}

# 限流：按 IP 每分钟 120 个请求，突发 40；按连接数每 IP 20
limit_req_zone $binary_remote_addr zone=kb_req:10m rate=120r/m;
limit_conn_zone $binary_remote_addr zone=kb_conn:10m;

# 公共安全响应头（HTTPS server 内统一注入）
map $upstream_http_x_request_id $kb_request_id {
    default $upstream_http_x_request_id;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 32m;
    server_tokens off;

    # 存活/就绪探针放行（无敏感信息）
    location /v1/health {
        proxy_pass http://private_kb;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /v1/ready {
        proxy_pass http://private_kb;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 其余一律跳 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 32m;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # 限流：全站按 IP 限速 + 连接数限制
    limit_req zone=kb_req burst=40 nodelay;
    limit_conn kb_conn 20;

    location / {
        proxy_pass http://private_kb;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
